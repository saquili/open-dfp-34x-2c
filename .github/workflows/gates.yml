#
# The offline gates of "make check", plus the self-tests of the equivalence
# tools, the unit tests of the bench, of the device tests and of the
# instruction-set gate, the tests and style checks of the programs of the ONU,
# the tests of the scripts that fetch the build system and archive the kernel,
# the tests of the size check of the images and of the scripts and lists of
# the distribution, and the licensing check, on every change to any component.

name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  provenance:
    runs-on: [self-hosted, linux, x64]
    # The pinned host build environment: Debian 13, by digest.
    container: debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
    timeout-minutes: 20
    steps:
      - name: Install the tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3
          git config --global --add safe.directory '*'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: The gates' own tests
        run: tools/provenance/check selftest
      - name: The tree and every commit
        # "make check" compares with a local main; a checkout here has none,
        # so the history mode reads every commit instead.
        run: tools/provenance/check all --history

  equivalence-tools:
    runs-on: [self-hosted, linux, x64]
    container: debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
    timeout-minutes: 20
    steps:
      - name: Install the tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3
          git config --global --add safe.directory '*'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Self-tests
        run: tools/equiv/tests/run -v

  bench:
    runs-on: [self-hosted, linux, x64]
    container: debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
    timeout-minutes: 20
    steps:
      - name: Install the tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3
          git config --global --add safe.directory '*'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Unit tests of the bench
        # They need no board, no network and no tmux: the tool runs against a
        # simulated console and a scripted boot loader.
        run: python3 -m unittest discover -s tools/bench/tests -t tools
      - name: Unit tests of the device tests
        # The cases run against canned replies of the stick and the bench host.
        run: cd tests/device && python3 -m unittest discover -s devtest/tests -t .

  programs:
    runs-on: [self-hosted, linux, x64]
    container: debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
    timeout-minutes: 30
    steps:
      - name: Install the tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git make gcc libc6-dev \
            python3 perl clang-format gcovr libmnl-dev zlib1g-dev rsync
          git config --global --add safe.directory '*'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: The user-space headers of this tree's kernel
        # The programs that speak to the kernel's PON interfaces include them.
        run: make -s -C linux O=/tmp/headers ARCH=x86 headers_install INSTALL_HDR_PATH=/tmp/uapi
      - name: omcid
        # The tests on the host backend, the style gate, the coverage gate, and
        # the programs of the board, whose kernel backend no test compiles.
        run: |
          make -C omcid -j4 CC=gcc check
          make -C omcid check-style CLANG_FORMAT=clang-format \
            CHECKPATCH="$PWD/linux/scripts/checkpatch.pl"
          make -C omcid -j4 CC=gcc coverage
          make -C omcid -j4 CC=gcc CPPFLAGS=-I/tmp/uapi/include board
      - name: onu-utils, pppoed, dhcp6d and pond
        # Their tests, and checkpatch, which may report checks but no warning
        # and no error. VOLATILE is the kernel's rule, not these programs':
        # the flag a signal handler sets is a volatile sig_atomic_t in C.
        run: |
          for p in onu-utils pppoed dhcp6d pond; do
            make -C "$p" check CPPFLAGS=-I/tmp/uapi/include
            # checkpatch exits non-zero on checks too, so its totals decide.
            (cd "$p" && find src tests -name '*.[ch]' | sort |
              xargs ../linux/scripts/checkpatch.pl --no-tree --strict --terse \
                --ignore VOLATILE -f ||
              true) > "/tmp/$p.checkpatch"
            cat "/tmp/$p.checkpatch"
            grep -q '^total: ' "/tmp/$p.checkpatch"
            if grep '^total: ' "/tmp/$p.checkpatch" | grep -v -q '^total: 0 errors, 0 warnings, '; then
              echo "$p: checkpatch reports errors or warnings" >&2
              exit 1
            fi
          done

  isa-gate:
    runs-on: [self-hosted, linux, x64]
    container: debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
    timeout-minutes: 20
    steps:
      - name: Install the tools
        # The gate reads the instructions of the target binaries with the
        # cross binutils' objdump; its tests build small MIPS objects.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 \
            binutils-mips-linux-gnu
          git config --global --add safe.directory '*'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Self-tests
        run: tools/isa-gate/tests/run -v

  lib-trim:
    runs-on: [self-hosted, linux, x64]
    container: debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
    timeout-minutes: 20
    steps:
      - name: Install the tools
        # The tests build a small C library, its libraries and a program for
        # MIPS with the cross compiler and read them with its binutils.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 \
            gcc-mips-linux-gnu binutils-mips-linux-gnu
          git config --global --add safe.directory '*'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Self-tests
        run: tools/lib-trim/tests/run -v

  buildroot-fetch:
    runs-on: [self-hosted, linux, x64]
    container: debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
    timeout-minutes: 20
    steps:
      - name: Install the tools
        # The fetch script applies the carried patches with patch, and "make
        # buildroot" runs it; the kernel archive tool needs git and xz.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 \
            patch make xz-utils
          git config --global --add safe.directory '*'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Self-tests of the fetch script
        run: buildroot/tests/run -v
      - name: Self-tests of the kernel archive tool
        run: tools/kernel-archive/tests/run -v
      - name: Self-tests of the kernel series tool, and its page
        run: |
          tools/kernel-series/tests/run -v
          tools/kernel-series/kernel-series check
      - name: The pinned release and the carried patches
        # The tests above use a tarball of their own. This one fetches the
        # pinned release from its URL, refuses it unless it is the pinned file,
        # and applies the carried patches to it, so a pin or a patch that
        # changed without the other fails here.
        run: make buildroot

  image-budget:
    runs-on: [self-hosted, linux, x64]
    container: debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
    timeout-minutes: 20
    steps:
      - name: Install the tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3
          git config --global --add safe.directory '*'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Self-tests of the size check of the images
        # They compare its two numbers with those of the flash layout page and
        # of the bench, so they read tools/bench and docs/handbook.
        run: tools/image-budget/tests/run -v

  image-scripts:
    runs-on: [self-hosted, linux, x64]
    container: debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
    timeout-minutes: 20
    steps:
      - name: Install the tools
        # The tests of the post-image script run the real mksquashfs and
        # unsquashfs, and are skipped without them.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 \
            squashfs-tools
          git config --global --add safe.directory '*'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Tests of the image scripts, the boot script and the defconfig
        # No toolchain is needed: the scripts run against stand-ins and small
        # trees, the boot script and the defconfig are read, and the list of the
        # known findings of the toolchain's libraries is compared with gate
        # output written out by hand. A test that is skipped is a failure here,
        # so that the ones that need squashfs-tools cannot fall silent.
        run: |
          br2-external/tests/run -v 2>&1 | tee /tmp/tests.log
          if grep -q ' skipped ' /tmp/tests.log; then
            echo 'a test was skipped' >&2
            exit 1
          fi

  licensing:
    runs-on: [self-hosted, linux, x64]
    container: debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
    timeout-minutes: 20
    steps:
      - name: Install the tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 \
            python3-venv
          git config --global --add safe.directory '*'
          python3 -m venv /opt/reuse
          /opt/reuse/bin/pip install 'reuse[charset-normalizer]==6.2.0'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: reuse lint
        run: /opt/reuse/bin/reuse lint
