#
# The known vulnerabilities of what the image is made of, every day and on
# request (tools/vulns/README.rst): the CVEs of the packages of the board's
# configuration, newer releases of the kernel's series with the CVEs they fix,
# a newer Mongoose, a newer Buildroot point release, and the advisories of the
# panel's npm packages. A job fails while it has a finding, so that a failed
# run is the notice; each writes what it found to the run's summary. A pull
# request that changes the checks runs them as well: the schedule runs only
# the workflow of the default branch.

name: vulns

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/vulns.yml"
      - "tools/vulns/**"

permissions:
  contents: read

concurrency:
  group: vulns
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  packages:
    runs-on: ubuntu-24.04
    container: debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
    timeout-minutes: 60
    steps:
      - name: Install the tools
        # buildroot/fetch needs patch; Buildroot's configuration needs a C
        # compiler for kconfig; pkg-stats needs aiohttp and requests, and git
        # for the NVD's data.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 \
            python3-aiohttp python3-requests python3-setuptools patch make xz-utils \
            gcc g++ file wget cpio rsync bc unzip perl
          git config --global --add safe.directory '*'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: The pinned Buildroot, configured as the board's image
        # The board's own defconfig builds the toolchain from source, so that
        # the C library the stick runs is among the packages. Nothing is built.
        # pkg-stats names the commit of the Buildroot tree it reads, so the
        # unpacked release becomes a repository of one empty commit.
        run: |
          br=$(buildroot/fetch -q)
          echo "BR=$br" >> "$GITHUB_ENV"
          git -C "$br" init -q
          git -C "$br" -c user.name=vulns -c user.email=vulns@example.invalid \
            commit -q --allow-empty -m "Buildroot $(sed -n 's/^VERSION=//p' buildroot/VERSION)"
          OPEN_DFP_34X_2C_KERNEL_ARCHIVE=/dev/null \
            make -s -C "$br" O="$PWD/build/vulns" BR2_EXTERNAL="$PWD/br2-external" \
            odi_dfp_34x_2c3_defconfig
      - name: The NVD's data
        # The repository that pkg-stats reads the NVD from, its last state alone.
        run: git clone -q --depth 1 https://github.com/fkie-cad/nvd-json-data-feeds build/nvd/git
      - name: pkg-stats
        run: |
          cd build/vulns
          OPEN_DFP_34X_2C_KERNEL_ARCHIVE=/dev/null "$BR/support/scripts/pkg-stats" -c \
            --disable url,upstream,warnings --json pkg-stats.json --nvd-path ../nvd
      - name: The CVEs of the packages the stick runs
        run: tools/vulns/vulns packages build/vulns/pkg-stats.json | tee -a "$GITHUB_STEP_SUMMARY"

  kernel:
    runs-on: ubuntu-24.04
    container: debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
    timeout-minutes: 20
    steps:
      - name: Install the tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3
          git config --global --add safe.directory '*'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: The kernel's CVE records
        # Only the .dyad files, which say which releases each CVE is fixed in.
        run: |
          git clone -q --depth 1 --no-checkout \
            https://git.kernel.org/pub/scm/linux/security/vulns.git build/kvulns
          git -C build/kvulns sparse-checkout set --no-cone '/cve/published/**/*.dyad'
          git -C build/kvulns checkout -q
      - name: The kernel of linux/ against its series
        run: tools/vulns/vulns kernel --cves build/kvulns/cve | tee -a "$GITHUB_STEP_SUMMARY"

  releases:
    runs-on: ubuntu-24.04
    container: debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
    timeout-minutes: 10
    steps:
      - name: Install the tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates python3
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Mongoose and Buildroot
        # Both are looked at even when the first has a finding.
        run: |
          rc=0
          tools/vulns/vulns mongoose | tee -a "$GITHUB_STEP_SUMMARY" || rc=1
          echo >> "$GITHUB_STEP_SUMMARY"
          tools/vulns/vulns buildroot | tee -a "$GITHUB_STEP_SUMMARY" || rc=1
          exit $rc

  npm:
    runs-on: ubuntu-24.04
    container: debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
    timeout-minutes: 10
    steps:
      - name: Install the tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates nodejs npm
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: The advisories of the panel's packages
        # From the lock file alone: nothing is installed or run. The panel's
        # build tools are judged with what goes into its bundle.
        working-directory: pond/web
        run: |
          set -o pipefail
          { echo "## The panel's npm packages"; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          rc=0
          npm audit --package-lock-only --audit-level=low 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc
