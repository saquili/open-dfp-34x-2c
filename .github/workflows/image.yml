#
# The flash images of the board, built from source by the pinned Buildroot with
# br2-external/configs/odi_dfp_34x_2c3_defconfig ("make" in the top directory),
# and checked: the size of each against its partition, the instruction-set gate
# over every executable of the root filesystem and its negative control, the
# static programs run under qemu-mips, the bench's dry run of the root
# filesystem image, and a second build in another directory that has to give the
# same images and the same root filesystem tree. Two builds take the better part
# of an hour on a runner, so the workflow runs only when it is started by hand.
# It uses no secret; the images are kept as a workflow artifact.

name: image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  image:
    runs-on: ubuntu-24.04
    # The pinned host build environment: Debian 13, by digest.
    container:
      image: debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
      # The runner's own tools that a build here does not use, mounted so that
      # the first step can remove them: a build needs more of the runner's
      # disk than it has free otherwise.
      volumes:
        - /usr/share/dotnet:/runner-unused/dotnet
        - /usr/local/lib/android:/runner-unused/android
        - /opt/ghc:/runner-unused/ghc
        - /opt/hostedtoolcache:/runner-unused/toolcache
    timeout-minutes: 150
    env:
      # br2-external/toolchain/fetch takes the toolchain that
      # br2-external/toolchain/PIN names through GitHub's API with this token,
      # which reaches a private repository too.
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Make room on the runner
        run: |
          df -h / | tail -n 1
          rm -rf /runner-unused/*/* || true
          df -h / | tail -n 1
      - name: Install the tools
        # The packages Buildroot needs of its host (the kernel build adds bison
        # and flex), the cross binutils for the objdump of the gate's
        # negative control, the cross compiler for that control and the
        # user-mode emulator for the static programs.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 \
            patch xz-utils make gcc g++ libc6-dev binutils perl bzip2 gzip cpio \
            unzip rsync file bc findutils gawk wget sed diffutils tar debianutils \
            bison flex binutils-mips-linux-gnu gcc-mips-linux-gnu qemu-user
          git config --global --add safe.directory '*'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the images
        # make fetches and patches the build system, configures the board's
        # defconfig, builds, and then judges the result: k0 and r0 have to fit
        # their partitions, the gate has to pass over the target tree, and the
        # digests of the images have to check.
        run: |
          start=$(date +%s)
          make IMAGE_OUT="$PWD/build/image-a"
          echo "the first build took $(( $(date +%s) - start )) seconds"
          ls -l build/image-a/images
          cat build/image-a/images/SHA256SUMS
      - name: What was built
        run: |
          t=build/image-a/host/bin/mips-buildroot-linux-uclibc
          "$t-gcc" --version | head -n 1
          grep -e '^CONFIG_CC_VERSION_TEXT' build/image-a/build/linux-custom/.config
          build/image-a/host/bin/mkimage -l build/image-a/images/k0.uImage
          file build/image-a/target/bin/busybox build/image-a/target/usr/sbin/dropbear
          # The programs share the C library that the post-build script cut;
          # libgcc_s, which nothing loads, is not shipped.
          find build/image-a/target \( -name '*.so' -o -name '*.so.*' -o -name 'ld-*' \) | sort
          ! find build/image-a/target -name 'libgcc_s*' | grep .
      - name: The negative control of the gate
        # The gate has to be able to fail: a MIPS32 object is refused.
        run: br2-external/tests/toolchain/negative-control
      - name: The programs run under qemu-mips
        run: br2-external/tests/image/check-applets build/image-a/target
      - name: The bench accepts the root filesystem image
        # A dry run prints the plan and touches no board and no host; the
        # settings are the bench's defaults, whose addresses are in the ranges
        # reserved for documentation.
        run: make flash IMAGE=build/image-a/images/r0.squashfs TARGET=rootfs ARGS=--dry-run
      - name: Keep the images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: images
          path: |
            build/image-a/images/k0.uImage
            build/image-a/images/r0.squashfs
            build/image-a/images/update.bin
            build/image-a/images/web-install.tar
            build/image-a/images/SHA256SUMS
          if-no-files-found: error
      - name: Make room for the second build
        if: always()
        run: |
          br2-external/tests/image/tree-digest build/image-a/target > /tmp/tree-a.txt
          rm -rf build/image-a/build build/image-a/host build/image-a/staging
      - name: Build again, in another directory
        if: always()
        run: |
          start=$(date +%s)
          make IMAGE_OUT="$PWD/build/image-b"
          echo "the second build took $(( $(date +%s) - start )) seconds"
      - name: The two builds are the same
        # The directories are named image-a and image-b. The images have to be
        # identical byte for byte, and so do the files of the root filesystem
        # tree with their modes, sizes and digests.
        if: always()
        run: |
          cmp build/image-a/images/k0.uImage build/image-b/images/k0.uImage
          cmp build/image-a/images/r0.squashfs build/image-b/images/r0.squashfs
          diff build/image-a/images/SHA256SUMS build/image-b/images/SHA256SUMS
          br2-external/tests/image/tree-digest build/image-b/target > /tmp/tree-b.txt
          wc -l < /tmp/tree-b.txt
          diff /tmp/tree-a.txt /tmp/tree-b.txt
          echo "the two builds are identical"
