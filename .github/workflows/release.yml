# SPDX-FileCopyrightText: 2026 Paweł Phan <szop.hektar_1w@icloud.com>
#
# A release, started by hand on the page of this workflow, from the commit it
# is started on. The flash images of the board are built from source by the
# pinned Buildroot, as image.yml builds them, with the toolchain of the release
# that br2-external/toolchain/PIN names (or one built from source when it names
# none), with no bench's files; checked; built twice, on two runners at once,
# and compared byte for byte; and the sources of everything in them are
# gathered (make legal-info, which adds the toolchain's own). The release is
# named by the image's own version, the time of the commit in UTC
# (post-build.sh): its tag is v2026.10.19-2130 for 2026.10.19-2130. The last
# job, the only one that may write to the repository, makes a draft release of
# that tag on that commit, with the files and their SHA-256 digests, for a
# person to test on a stick and publish; the tag comes into being when it is
# published. Nothing built elsewhere goes into a release.

name: release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-24.04
    # The pinned host build environment: Debian 13, by digest.
    container:
      image: debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
      # The runner's own tools that a build here does not use, mounted so that
      # the first step can remove them: a build needs more of the runner's
      # disk than it has free otherwise.
      volumes:
        - /usr/share/dotnet:/runner-unused/dotnet
        - /usr/local/lib/android:/runner-unused/android
        - /opt/ghc:/runner-unused/ghc
        - /opt/hostedtoolcache:/runner-unused/toolcache
    timeout-minutes: 300
    strategy:
      # The two builds that are compared, each on a runner of its own and in a
      # directory of its own; "a" also gathers the files of the release.
      matrix:
        build: [a, b]
    env:
      # br2-external/toolchain/fetch takes the pinned toolchain through
      # GitHub's API with this token, which reaches a private repository too.
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Make room on the runner
        run: |
          df -h / | tail -n 1
          rm -rf /runner-unused/*/* || true
          df -h / | tail -n 1
      - name: Install the tools
        # As image.yml: what Buildroot needs of its host, the cross binutils
        # and compiler for the gate's negative control, and the user-mode
        # emulator for the static programs.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 \
            patch xz-utils make gcc g++ libc6-dev binutils perl bzip2 gzip cpio \
            unzip rsync file bc findutils gawk wget sed diffutils tar debianutils \
            bison flex binutils-mips-linux-gnu gcc-mips-linux-gnu qemu-user
          git config --global --add safe.directory '*'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the images
        # make judges what it built: the images fit their partitions, the
        # instruction-set gate passes over the root filesystem tree, and the
        # digests check.
        run: |
          grep -v '^#' br2-external/toolchain/PIN
          start=$(date +%s)
          make IMAGE_OUT="$PWD/build/image-${{ matrix.build }}"
          echo "the build took $(( $(date +%s) - start )) seconds"
          echo "toolchain: $(cat build/image-${{ matrix.build }}/.toolchain)"
          cat build/image-${{ matrix.build }}/images/SHA256SUMS
      - name: The version
        # The image's own: a release carries no build of uncommitted sources
        # and none whose commit is not known.
        id: version
        run: |
          release=build/image-${{ matrix.build }}/target/etc/os-release
          version=$(sed -n 's/^VERSION_ID=//p' "$release")
          echo "version $version, commit $(sed -n 's/^BUILD_ID=//p' "$release")"
          if ! [[ $version =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]{4}$ ]]; then
            echo "not a version a release can carry: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: No bench's files in the image
        # A bench's addresses, ssh keys, token of scripts and console without
        # a password come from OPEN_DFP_34X_2C_LOCAL_OVERLAY, which this build
        # does not name; this says that none came in another way.
        run: |
          for f in etc/board.conf etc/pond.token root/.ssh/authorized_keys; do
            if [ -e "build/image-${{ matrix.build }}/target/$f" ]; then
              echo "/$f is in the image"
              exit 1
            fi
          done
      - name: The negative control of the gate
        run: br2-external/tests/toolchain/negative-control
      - name: The programs run under qemu-mips
        run: br2-external/tests/image/check-applets build/image-${{ matrix.build }}/target
      - name: What the comparison needs
        run: |
          mkdir compare
          cp build/image-${{ matrix.build }}/images/{k0.uImage,r0.squashfs,update.bin,web-install.tar,SHA256SUMS} compare/
          br2-external/tests/image/tree-digest build/image-${{ matrix.build }}/target > compare/tree.txt
      - name: Keep what the comparison needs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-${{ matrix.build }}
          path: compare/
          if-no-files-found: error
      - name: The sources
        # Every package's licence and source, the sources the GPL asks a
        # release to offer among them, and the toolchain's, as one archive
        # beside the images; the sources are compressed archives already, so
        # the archive is not.
        if: matrix.build == 'a'
        run: make legal-info IMAGE_OUT="$PWD/build/image-a"
      - name: The files of the release
        if: matrix.build == 'a'
        run: |
          version=${{ steps.version.outputs.version }}
          mkdir dist
          cp build/image-a/images/{k0.uImage,r0.squashfs,update.bin,web-install.tar} dist/
          tar -C build/image-a --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git log -1 --format=%ct)" \
            -cf "dist/open-dfp-34x-2c-$version-sources.tar" legal-info
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
          ls -l dist
      - name: Keep the files
        if: matrix.build == 'a'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  compare:
    # A release is only made of a build that another build repeats.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: The two builds are the same
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name build-a --dir a
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name build-b --dir b
          for f in k0.uImage r0.squashfs update.bin web-install.tar; do
            cmp "a/$f" "b/$f"
          done
          diff a/SHA256SUMS b/SHA256SUMS
          diff a/tree.txt b/tree.txt
          echo "the two builds are identical"

  draft:
    needs: [build, compare]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: The files, as the build kept them
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release --dir dist
          cd dist && sha256sum -c SHA256SUMS
      - name: The draft release
        # Refused when the tag or a release of it exists already: a version
        # is released once.
        run: |
          cat > notes.md <<EOF
          The images of commit ${GITHUB_SHA}, built twice and compared by
          this repository's release workflow (run ${GITHUB_RUN_ID}).

          - \`web-install.tar\`: installs this system through the shipped
            firmware's web page (docs/handbook/updating.rst).
          - \`update.bin\`: updates a stick that runs this system, from its
            panel or with \`onu-update write\`.
          - \`k0.uImage\`, \`r0.squashfs\`: the two images, for the bench
            (docs/handbook/flashing.rst).
          - \`open-dfp-34x-2c-${VERSION}-sources.tar\`: the licences and
            the sources of everything in the images, the toolchain's among
            them.
          - \`SHA256SUMS\`: their digests; check them before an install.

          Read "Before you install" in README.rst first.
          EOF
          cd dist
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --title "open-dfp-34x-2c $VERSION" --notes-file ../notes.md -- *
