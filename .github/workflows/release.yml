#
# A release, started by hand on the page of this workflow, from the commit it
# is started on, once the gates (gates.yml) have passed on that very commit.
# The flash images of the board are built from source by the pinned
# Buildroot, as image.yml builds them, with the toolchain of the release that
# br2-external/toolchain/PIN names (or one built from source when it names
# none), with no bench's files; checked; built twice, on two runners at once,
# and compared byte for byte; and the sources of everything in them are
# gathered (make legal-info, which adds the toolchain's own). The release is
# named by the image's own version, the time of the commit in UTC
# (post-build.sh): its tag is v2026.10.19-2130 for 2026.10.19-2130. The last
# job, the only one that may write to the repository, makes a draft release of
# that tag on that commit, with the files and their SHA-256 digests, for a
# person to test on two sticks against the lab OLT and publish. It is a full
# release, not a pre-release: published, it is the repository's latest, which
# a release of the toolchain never is (toolchain.yml). The tag comes into
# being when it is published. Nothing built elsewhere goes into a release.

name: release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  gates:
    # A release is only made of a commit the gates passed on: a run of
    # gates.yml on exactly this commit, completed with success. The run of a
    # pull request does not count, as it tests the pull request merged into
    # its base, and neither does a cancelled one: a push to the same branch
    # cancels the run before it (gates.yml, concurrency). The result is looked
    # up rather than made again: the commit has it.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: The gates passed on this commit
        run: |
          list() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow gates.yml \
              --commit "$GITHUB_SHA" --limit 100 "$@"
          }
          echo "the runs of gates.yml on $GITHUB_SHA:"
          list
          passed=$(list --json status,conclusion,event --jq '[.[]
            | select(.event == "push" or .event == "workflow_dispatch")
            | select(.status == "completed" and .conclusion == "success")] | length')
          if [ "$passed" -gt 0 ]; then
            echo "the gates passed on $GITHUB_SHA"
            exit 0
          fi
          running=$(list --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$running" -gt 0 ]; then
            echo "::error::gates.yml is still running on $GITHUB_SHA. Start the release again once it has passed."
          else
            echo "::error::No run of gates.yml passed on $GITHUB_SHA. Run gates on ${GITHUB_REF_NAME} (Actions, gates, Run workflow) while that commit is its head, and start the release again once it has passed."
          fi
          exit 1

  build:
    # Only a commit the gates passed on is built.
    needs: gates
    runs-on: ubuntu-24.04
    # The pinned host build environment: Debian 13, by digest.
    container:
      image: debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
      # The runner's own tools that a build here does not use, mounted so that
      # the build step can remove them as it runs: a build needs more of the
      # runner's disk than it has free otherwise.
      volumes:
        - /usr/share/dotnet:/runner-unused/dotnet
        - /usr/local/lib/android:/runner-unused/android
        - /opt/ghc:/runner-unused/ghc
        - /opt/hostedtoolcache:/runner-unused/toolcache
    timeout-minutes: 300
    strategy:
      # The two builds that are compared, each on a runner of its own and in a
      # directory of its own; "a" also gathers the files of the release.
      matrix:
        build: [a, b]
    env:
      # br2-external/toolchain/fetch takes the pinned toolchain through
      # GitHub's API with this token, which reaches a private repository too.
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Install the tools
        # As image.yml: what Buildroot needs of its host, the cross binutils
        # and compiler for the gate's negative control, and the user-mode
        # emulator for the static programs.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 \
            patch xz-utils make gcc g++ libc6-dev binutils perl bzip2 gzip cpio \
            unzip rsync file bc findutils gawk wget sed diffutils tar debianutils \
            bison flex binutils-mips-linux-gnu gcc-mips-linux-gnu qemu-user cmake zstd
          git config --global --add safe.directory '*'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: The tree of linux/
        id: linux
        run: echo "tree=$(git rev-parse HEAD:linux)" >> "$GITHUB_OUTPUT"
      - name: The archive of linux/, kept by its tree
        # tools/kernel-archive makes the same archive from the same tree and
        # takes the one it finds; making it again costs four minutes.
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/kernel
          key: kernel-archive-${{ steps.linux.outputs.tree }}
      - name: The downloads, kept by the packages that name them
        # Buildroot checks every download against its hash, and fetches what
        # is missing; the pinned toolchain is checked against its pin.
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/dl
          key: dl-${{ hashFiles('buildroot/VERSION', 'buildroot/patches/**', 'br2-external/package/**', 'br2-external/configs/**', 'br2-external/toolchain/PIN') }}
          restore-keys: dl-
      - name: Build the images
        # make judges what it built: the images fit their partitions, the
        # instruction-set gate passes over the root filesystem tree, and the
        # digests check.
        # The runner's own tools go in the background while it builds: the
        # build needs their room only later, and taking them first cost five
        # minutes.
        run: |
          df -h / | tail -n 1
          rm -rf /runner-unused/*/* &
          cleaner=$!
          grep -v '^#' br2-external/toolchain/PIN
          start=$(date +%s)
          make IMAGE_OUT="$PWD/build/image-${{ matrix.build }}"
          wait "$cleaner" || true
          df -h / | tail -n 1
          echo "the build took $(( $(date +%s) - start )) seconds"
          echo "toolchain: $(cat build/image-${{ matrix.build }}/.toolchain)"
          cat build/image-${{ matrix.build }}/images/SHA256SUMS
      - name: The version
        # The image's own: a release carries no build of uncommitted sources
        # and none whose commit is not known.
        id: version
        run: |
          release=build/image-${{ matrix.build }}/target/etc/os-release
          version=$(sed -n 's/^VERSION_ID=//p' "$release")
          echo "version $version, commit $(sed -n 's/^BUILD_ID=//p' "$release")"
          if ! [[ $version =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]{4}$ ]]; then
            echo "not a version a release can carry: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: No bench's files in the image
        # A bench's addresses, ssh keys, token of scripts and console without
        # a password come from OPEN_DFP_34X_2C_LOCAL_OVERLAY, which this build
        # does not name; this says that none came in another way.
        run: |
          for f in etc/board.conf etc/pond.token root/.ssh/authorized_keys; do
            if [ -e "build/image-${{ matrix.build }}/target/$f" ]; then
              echo "/$f is in the image"
              exit 1
            fi
          done
      - name: The negative control of the gate
        run: br2-external/tests/toolchain/negative-control
      - name: The programs run under qemu-mips
        run: br2-external/tests/image/check-applets build/image-${{ matrix.build }}/target
      - name: What the comparison needs
        run: |
          mkdir compare
          cp build/image-${{ matrix.build }}/images/{k0.uImage,r0.squashfs,update.bin,web-install.tar,SHA256SUMS} compare/
          br2-external/tests/image/tree-digest build/image-${{ matrix.build }}/target > compare/tree.txt
      - name: Keep what the comparison needs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-${{ matrix.build }}
          path: compare/
          if-no-files-found: error
      - name: The sources
        # Every package's licence and source, the sources the GPL asks a
        # release to offer among them, and the toolchain's, as one archive
        # beside the images; the sources are compressed archives already, so
        # the archive is not.
        if: matrix.build == 'a'
        run: make legal-info IMAGE_OUT="$PWD/build/image-a"
      - name: The files of the release
        if: matrix.build == 'a'
        run: |
          version=${{ steps.version.outputs.version }}
          mkdir dist
          cp build/image-a/images/{k0.uImage,r0.squashfs,update.bin,web-install.tar} dist/
          tar -C build/image-a --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git log -1 --format=%ct)" \
            -cf "dist/open-dfp-34x-2c-$version-sources.tar" legal-info
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
          ls -l dist
      - name: Keep the files
        if: matrix.build == 'a'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  compare:
    # A release is only made of a build that another build repeats.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: The two builds are the same
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name build-a --dir a
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name build-b --dir b
          for f in k0.uImage r0.squashfs update.bin web-install.tar; do
            cmp "a/$f" "b/$f"
          done
          diff a/SHA256SUMS b/SHA256SUMS
          diff a/tree.txt b/tree.txt
          echo "the two builds are identical"

  draft:
    needs: [build, compare]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: The files, as the build kept them
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release --dir dist
          cd dist && sha256sum -c SHA256SUMS
      - name: The draft release
        # Refused when the tag or a release of it exists already: a version
        # is released once. A full release, not a pre-release: published, it
        # is the repository's latest.
        run: |
          cat > notes.md <<EOF
          A test build: the images of commit ${GITHUB_SHA}, whose gates
          passed, built twice and compared by this repository's release
          workflow (run ${GITHUB_RUN_ID}), and tested on two sticks against
          the lab OLT before they were published.

          > [!WARNING]
          > **Take great care, and keep a backup first.** The install is not
          > expected to remove your data or settings: it writes this system
          > into the bank the shipped firmware does not run from, and leaves
          > the shipped firmware's bank and its settings as they were; this
          > system keeps its own settings beside them. It overwrites what the
          > other bank held, which on a stick as sold was an earlier build of
          > the shipped firmware. But these are test builds, tried on few
          > sticks, so be careful. Before the install,
          > write down what the shipped firmware's pages show and you would
          > need again: the line's identity (the GPON serial number, and the
          > PLOAM password or LOID if your line uses one), the MAC address and
          > any setting you changed. After it, copy the whole flash over ssh
          > before anything else (install guide, step 6); the panel's button
          > for that copy has not been tried on a stick yet.

          Start with the install guide, docs/handbook/install-guide.rst: the
          install, the first sign-in, an update and each way back, step by
          step.

          - \`web-install.tar\`: installs this system through the shipped
            firmware's web page (docs/handbook/install-guide.rst).
          - \`update.bin\`: updates a stick that runs this system, from its
            panel or with \`onu-update write\`.
          - \`k0.uImage\`, \`r0.squashfs\`: the two images, for the bench
            (docs/handbook/flashing.rst).
          - \`open-dfp-34x-2c-${VERSION}-sources.tar\`: the licences and
            the sources of everything in the images, the toolchain's among
            them.
          - \`SHA256SUMS\`: their digests; check them before an install.

          Read "Before you install" in README.rst first.
          EOF
          cd dist
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --title "open-dfp-34x-2c $VERSION" --notes-file ../notes.md -- *
