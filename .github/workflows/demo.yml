#
# The panel as a demo on the repository's GitHub Pages site: pond/web built in
# its demo mode, in which a mock stick answers the panel's API in the browser
# (pond/README.rst), served from /<repository>/. It runs on a change to the
# panel on main, and when started by hand. The site's source must be set to
# GitHub Actions in the repository's Pages settings.

name: demo

on:
  push:
    branches: [main]
    paths:
      - pond/web/**
      - .github/workflows/demo.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
    timeout-minutes: 20
    steps:
      - name: Install the tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates nodejs npm
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the demo
        working-directory: pond/web
        env:
          POND_DEMO_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm run build:demo
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pond/web/dist-demo

  deploy:
    # Publishes what the build job made; nothing is built here.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
