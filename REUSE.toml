#
# REUSE annotations for the files that do not carry their licensing inline.
#
# COPYING carries the licence text itself. The GNU GPL version 2 text in it is
# the Free Software Foundation's; the project uses it under GPL-2.0-only.
#
# linux/ is the Linux kernel, imported unchanged from its release, and keeps
# the kernel's own licensing scheme: each source file names its licence with
# an SPDX identifier, linux/LICENSES/ holds the licence texts, and
# linux/Documentation/process/license-rules.rst gives the rules, which the
# kernel's scripts/spdxcheck.py and scripts/checkpatch.pl check. REUSE cannot
# read that scheme file by file -- many identifiers use older SPDX forms, and
# not every file is tagged -- so the annotation below states, for REUSE, the
# licence of the kernel as a whole, as linux/COPYING gives it. The texts it
# names are in LICENSES/, copied from linux/LICENSES/. Inside linux/, the
# information in each file remains authoritative.
#
# Everything else in the tree carries an inline SPDX header.

version = 1

[[annotations]]
path = "COPYING"
precedence = "override"
SPDX-FileCopyrightText = "1989, 1991 Free Software Foundation, Inc."
SPDX-License-Identifier = "GPL-2.0-only"

[[annotations]]
path = "linux/**"
precedence = "override"
SPDX-FileCopyrightText = "The Linux kernel contributors"
SPDX-License-Identifier = "GPL-2.0-only WITH Linux-syscall-note"

# netifd/ is the network interface daemon of OpenWrt, carried as a fork and
# imported with "git subtree add --squash". Its sources carry their authors'
# GNU GPL version 2 notices without SPDX lines, and OpenWrt licenses the
# daemon as GPL-2.0; the annotation states that for REUSE. A file this
# project adds there carries its own SPDX header, which takes precedence.
[[annotations]]
path = "netifd/**"
precedence = "closest"
SPDX-FileCopyrightText = "The netifd contributors"
SPDX-License-Identifier = "GPL-2.0-only"

# Mongoose, the HTTP library of pond, is offered under GPL-2.0-only or a
# commercial licence, which its header names together; the project takes it
# under GPL-2.0-only.
[[annotations]]
path = "pond/third_party/mongoose/**"
precedence = "override"
SPDX-FileCopyrightText = ["2004-2013 Sergey Lyubka", "2013-2024 Cesanta Software Limited"]
SPDX-License-Identifier = "GPL-2.0-only"

# The records of the device tests (docs/testing/README.rst): the logs and
# the data that tests/device writes beside each page, which has its header.
[[annotations]]
path = ["docs/testing/*.json", "docs/testing/*.log"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Paweł Phan <szop.hektar_1w@icloud.com>"
SPDX-License-Identifier = "GPL-2.0-only"
