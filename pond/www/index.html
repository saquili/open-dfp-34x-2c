<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONU</title>
<style>
:root {
  --bg: #f4f5f7; --card: #fff; --fg: #1b2130; --dim: #5d6677; --faint: #8a93a3;
  --line: #e0e3e9; --accent: #2457c5; --accent-bg: #e8eefb;
  --good: #1d7a3b; --good-bg: #e3f4e8; --warn: #9a6300; --warn-bg: #fdf1d8;
  --bad: #b3261e; --bad-bg: #fbe5e3; --down: #2457c5; --up: #c2581b; --on-accent: #fff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11141a; --card: #1a1f28; --fg: #e5e9f0; --dim: #9aa4b5; --faint: #6f798a;
    --line: #2b3240; --accent: #82a7ff; --accent-bg: #1f2b45;
    --good: #7ad491; --good-bg: #183224; --warn: #f0c060; --warn-bg: #3a2f14;
    --bad: #ff8f86; --bad-bg: #3d1d1b; --down: #82a7ff; --up: #f0955a; --on-accent: #0d1424;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select { font: inherit; color: inherit; }
button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 7px;
  background: var(--card); cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
button.primary:disabled { opacity: .55; cursor: default; }
button.link { border: 0; background: none; padding: 2px 4px; color: var(--accent); white-space: nowrap; }
input[type=text], input[type=password], select { padding: 6px 9px; min-width: 0; width: 100%;
  border: 1px solid var(--line); border-radius: 7px; background: var(--bg); }
input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent);
  outline-offset: 1px; }

header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
header .brand { flex: 1 1 auto; min-width: 0; }
header h1 { font-size: 16px; margin: 0; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; }
header .sub { color: var(--dim); font-size: 12px; }
#live { color: var(--dim); font-size: 12px; white-space: nowrap; }
#live::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px;
  border-radius: 50%; background: var(--faint); vertical-align: 1px; }
#live.on::before { background: var(--good); }
#live.err { color: var(--bad); }
#live.err::before { background: var(--bad); }

main { max-width: 1180px; margin: 0 auto; padding: 16px 16px 40px; }
h2 { font-size: 13px; margin: 26px 0 10px; color: var(--dim); text-transform: uppercase;
  letter-spacing: .05em; }
.grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1040px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 16px; min-width: 0; }
.tile h3 { font-size: 13px; font-weight: 600; margin: 0 0 10px; color: var(--dim);
  display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.big { font-size: 26px; font-weight: 650; line-height: 1.15; letter-spacing: -.01em;
  font-variant-numeric: tabular-nums; }
.big small { font-size: 14px; font-weight: 500; color: var(--dim); margin-left: 3px; }
.caption { color: var(--dim); font-size: 12px; margin: 2px 0 10px; }
dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 0; }
dt { color: var(--dim); }
dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.chip { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px;
  font-weight: 600; white-space: nowrap; background: var(--line); color: var(--dim); }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.info { background: var(--accent-bg); color: var(--accent); }
.good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.muted { color: var(--dim); }

.traffic { display: grid; gap: 16px; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); }
.traffic .rates { display: grid; gap: 12px; align-content: start; }
.rate .label { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; }
.swatch { width: 10px; height: 3px; border-radius: 2px; }
.spark { width: 100%; height: 150px; display: block; }
.spark .grid-line { stroke: var(--line); stroke-width: 1; }
.spark text { fill: var(--faint); font-size: 10px; }
.spark .down { fill: none; stroke: var(--down); stroke-width: 2; }
.spark .up { fill: none; stroke: var(--up); stroke-width: 2; }
.spark .area { fill: var(--down); opacity: .08; }
.hw { margin-top: 10px; font-size: 13px; }

.modes { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  margin-bottom: 14px; }
.mode { display: block; position: relative; padding: 10px 12px 10px 36px; border-radius: 9px;
  border: 1px solid var(--line); cursor: pointer; background: var(--bg); }
.mode input { position: absolute; left: 12px; top: 13px; margin: 0; accent-color: var(--accent); }
.mode strong { display: block; }
.mode span { color: var(--dim); font-size: 12px; }
.mode:has(input:checked) { border-color: var(--accent); background: var(--accent-bg); }
fieldset { border: 0; margin: 0 0 12px; padding: 12px 0 0; border-top: 1px solid var(--line); }
fieldset[hidden] { display: none; }
legend { font-weight: 600; padding: 0 6px 0 0; }
.fields { display: grid; gap: 10px 16px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  margin-top: 6px; }
.field[hidden] { display: none; }
.field label { display: block; color: var(--dim); font-size: 12px; margin-bottom: 3px; }
.field .hint { color: var(--faint); font-size: 11px; margin-top: 2px; }
.pw { display: flex; gap: 6px; }
details.adv > summary { cursor: pointer; color: var(--dim); margin: 4px 0; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 6px;
  padding-top: 12px; border-top: 1px solid var(--line); }
#s-state { flex: 1 1 200px; }
.note { color: var(--dim); font-size: 12px; margin: 10px 0 0; }

details.diag > summary { cursor: pointer; font-size: 13px; color: var(--dim); text-transform: uppercase;
  letter-spacing: .05em; margin: 26px 0 10px; }
.dgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
.dcard { overflow-x: auto; }
.dcard h4 { font-size: 13px; margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline; }
.dcard h4 small { color: var(--faint); font-weight: normal; }
.dcat { font-size: 12px; color: var(--faint); margin: 14px 0 6px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
td, th { text-align: left; padding: 2px 6px; border-top: 1px solid var(--line); vertical-align: top;
  font-variant-numeric: tabular-nums; }
th { color: var(--dim); font-weight: 600; }
td.k { color: var(--dim); white-space: nowrap; width: 1%; }

#login { max-width: 380px; margin: 12vh auto 0; }
#login h2 { margin-top: 0; text-transform: none; letter-spacing: 0; font-size: 18px; color: var(--fg); }
#login form { display: grid; gap: 12px; }
#login label.check { display: flex; gap: 8px; align-items: center; color: var(--dim); }
#login-err { min-height: 1.4em; margin: 0; }

@media (max-width: 640px) {
  .traffic { grid-template-columns: 1fr; }
  .traffic .rates { grid-template-columns: 1fr 1fr; }
  header .sub { display: none; }
  header { gap: 6px; }
  #live .time { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1 id="title">ONU</h1>
    <div class="sub" id="subtitle">GPON SFP stick</div>
  </div>
  <span id="live" hidden></span>
  <button id="pause" class="link" hidden>Pause</button>
  <button id="signout" class="link" hidden>Sign out</button>
</header>

<main id="main">
  <section id="login" class="card" hidden>
    <h2>Sign in to the stick</h2>
    <form id="login-form">
      <div class="field">
        <label for="token">Token</label>
        <input id="token" type="password" autocomplete="current-password" required>
        <div class="hint">The token is in /etc/pond.token on the stick.</div>
      </div>
      <label class="check"><input id="remember" type="checkbox" checked> Remember on this browser</label>
      <button class="primary" type="submit">Sign in</button>
      <p id="login-err" class="bad"></p>
    </form>
  </section>

  <section id="app" hidden>
    <div class="grid" id="tiles">
      <div class="card tile" id="t-fibre"></div>
      <div class="card tile" id="t-net"></div>
      <div class="card tile" id="t-link"></div>
      <div class="card tile" id="t-dev"></div>
    </div>

    <h2>Traffic</h2>
    <div class="card traffic">
      <div class="rates">
        <div class="rate">
          <div class="label"><span class="swatch" style="background:var(--down)"></span>Download</div>
          <div class="big" id="r-down">-</div>
        </div>
        <div class="rate">
          <div class="label"><span class="swatch" style="background:var(--up)"></span>Upload</div>
          <div class="big" id="r-up">-</div>
        </div>
      </div>
      <div>
        <svg class="spark" id="spark" viewBox="0 0 600 150" preserveAspectRatio="none"
             role="img" aria-label="Traffic over the last ten minutes"></svg>
        <div class="hw" id="r-hw"></div>
      </div>
    </div>

    <h2>Settings</h2>
    <div class="card" id="settings"></div>

    <details class="diag" id="diag">
      <summary>Diagnostics: every value the stick reports</summary>
      <div id="diag-body"></div>
    </details>
  </section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const REFRESH_MS = 5000, HISTORY = 120;
let schema = [], timer = null, paused = false, last = {}, banks = null;
let prev = null, history = [];

/* ---- token ---- */

function saveToken(t, remember) {
  try {
    sessionStorage.setItem("pond-token", t);
    if (remember) localStorage.setItem("pond-token", t);
    else localStorage.removeItem("pond-token");
  } catch (e) { /* no storage: the token is asked for again */ }
}
function loadToken() {
  try { return sessionStorage.getItem("pond-token") || localStorage.getItem("pond-token") || ""; }
  catch (e) { return ""; }
}
function dropToken() {
  try { sessionStorage.removeItem("pond-token"); localStorage.removeItem("pond-token"); }
  catch (e) { /* nothing kept */ }
}
let token = loadToken();

class AuthError extends Error {}

/* A GET of the API, or a POST of body. */
async function api(path, body) {
  const opts = { headers: { Authorization: "Bearer " + token }, cache: "no-store" };
  if (body !== undefined) {
    opts.method = "POST";
    opts.headers["Content-Type"] = "text/plain";
    opts.body = body;
  }
  const r = await fetch(path, opts);
  const reply = await r.json().catch(() => ({ error: "not JSON", detail: r.statusText }));
  if (r.status === 401 || r.status === 403 && !path.startsWith("/api/set/"))
    throw new AuthError(reply.error || "the token was refused");
  if (!r.ok) throw new Error((reply.error || r.status) + (reply.detail ? ": " + reply.detail : ""));
  return reply;
}

/* ---- small helpers ---- */

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined && text !== null) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}
function chip(text, kind) { return el("span", text, "chip " + (kind || "")); }
function rows(list) {
  const dl = el("dl");
  list.filter(Boolean).forEach(([k, v, cls]) => {
    dl.appendChild(el("dt", k));
    const dd = el("dd", undefined, cls);
    if (v instanceof Node) dd.appendChild(v); else dd.textContent = v === undefined || v === null || v === "" ? "-" : v;
    dl.appendChild(dd);
  });
  return dl;
}
function tile(id, title, badge, parts) {
  const t = $(id), h = el("h3", title);
  if (badge) h.appendChild(badge);
  t.replaceChildren(h, ...parts.filter(Boolean));
}
function big(value, unit) {
  const b = el("div", value, "big");
  if (unit) b.appendChild(el("small", unit));
  return b;
}
function dbm(uw) {
  if (typeof uw !== "number" || uw <= 0) return null;
  return 10 * Math.log10(uw / 1000);
}
function fmtDbm(v) { return v === null ? "-" : (v > 0 ? "+" : "") + v.toFixed(1); }
function duration(s) {
  s = Math.floor(s);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d} d ${h} h` : h ? `${h} h ${m} min` : `${m} min ${s % 60} s`;
}
function rate(bps) {
  if (bps === null || !isFinite(bps)) return ["-", ""];
  if (bps >= 1e9) return [(bps / 1e9).toFixed(2), "Gb/s"];
  if (bps >= 1e6) return [(bps / 1e6).toFixed(bps >= 1e8 ? 0 : 1), "Mb/s"];
  if (bps >= 1e3) return [(bps / 1e3).toFixed(0), "kb/s"];
  return [bps.toFixed(0), "b/s"];
}
function port(name) { return (last.ports || []).find((p) => p.name === name); }

/* ---- the four tiles ---- */

const PON_STATES = {
  o1: ["Starting", "warn"], o2: ["Waiting for the OLT", "warn"], o3: ["Sending serial number", "warn"],
  o4: ["Ranging", "warn"], o5: ["Connected", "good"], o6: ["Signal lost", "bad"],
  o7: ["Stopped by the OLT", "bad"],
};

function fibreTile() {
  const onu = last.onu, op = last.optics;
  const st = onu && PON_STATES[String(onu.state).toLowerCase()];
  const badge = !onu ? chip("No PON device", "bad")
    : st ? chip(st[0], st[1]) : chip(String(onu.state), "warn");
  const rx = op ? dbm(op.rx_power_uw) : null, tx = op ? dbm(op.tx_power_uw) : null;
  let q = ["no light", "bad"];
  if (rx !== null) q = rx > -8 ? ["too strong", "warn"] : rx >= -25 ? ["good", "good"]
    : rx >= -28 ? ["weak", "warn"] : ["too weak", "bad"];
  const alarms = onu && onu.alarms && onu.alarms.length;
  tile("t-fibre", "Fibre (GPON)", badge, [
    op ? big(fmtDbm(rx), "dBm") : big("-"),
    el("div", op ? "Received light (good from -8 to -25 dBm)" : "No optics data",
       "caption"),
    rows([
      op && ["Light level", chip(q[0], q[1])],
      op && ["Transmitted", fmtDbm(tx) + " dBm"],
      op && ["Module temp.", op.temperature_c.toFixed(1) + " °C"],
      onu && ["ONU-ID", onu.state === "o5" ? onu.onu_id : "-"],
      onu && ["Alarms", alarms ? onu.alarms.join(", ") : "none", alarms ? "bad" : ""],
    ]),
  ]);
}

function settingsValue() { return last.settings || {}; }

function netTile() {
  const s = settingsValue(), mode = s.mode || (s.settings && s.settings.MODE);
  const onu = last.onu, ponUp = onu && onu.state === "o5";
  if (!mode) { tile("t-net", "Internet", chip("Unknown"), [el("p", "The mode is not known yet.", "muted")]); return; }
  if (mode === "bridge") {
    tile("t-net", "Internet", chip("Bridge", "info"), [
      big("Bridge"),
      el("div", "Your router connects to the operator itself; the stick passes the service through.", "caption"),
      rows([["PON", ponUp ? "connected" : "not connected", ponUp ? "" : "warn"]]),
    ]);
    return;
  }
  const up = s.wan && s.wan.out && (mode !== "passthrough" || s.pass);
  const badge = up ? chip("Online", "good") : ponUp ? chip("Connecting", "warn") : chip("Offline", "bad");
  const pppoe = mode === "passthrough" || (s.settings && s.settings.WAN_PROTO === "pppoe");
  if (mode === "passthrough") {
    tile("t-net", "Internet", badge, [
      big(s.pass ? s.pass.address : "-"),
      el("div", "Public IPv4 address, handed to your router", "caption"),
      rows([
        ["Connection", up ? "PPPoE session up" : "PPPoE session down", up ? "" : "warn"],
        ["Account", s.pppoe && s.pppoe.user ? s.pppoe.user : "not set", s.pppoe && s.pppoe.user ? "" : "bad"],
        ["Operator VLAN", s.settings && s.settings.WAN_VLAN || "none"],
        ["DNS", s.dns],
      ]),
    ]);
    return;
  }
  tile("t-net", "Internet", badge, [
    big(up ? "Online" : "Offline"),
    el("div", "The stick routes for the network behind it", "caption"),
    rows([
      ["WAN", s.wan ? `${s.wan.dev} on ${s.wan.gem}` : "-"],
      ["Protocol", s.settings ? s.settings.WAN_PROTO : "-"],
      pppoe && ["Account", s.pppoe && s.pppoe.user ? s.pppoe.user : "not set"],
      ["DNS", s.dns],
    ]),
  ]);
}

function linkTile() {
  const sfp = port("sfp"), s = settingsValue(), mode = s.mode || (s.settings && s.settings.MODE);
  const up = sfp && sfp.carrier === 1 && sfp.operstate === "up";
  const speed = sfp && sfp.speed_mbit > 0 ? (sfp.speed_mbit >= 1000 ? sfp.speed_mbit / 1000 + " Gb/s" : sfp.speed_mbit + " Mb/s") : "-";
  const conf = s.settings || {};
  tile("t-link", "Link to your router", up ? chip("Up", "good") : chip("No link", "bad"), [
    big(up ? speed : "-"),
    el("div", "The SFP link to the router's cage", "caption"),
    rows(mode === "passthrough" ? [
      ["Router's VLAN", conf.LAN_VLAN || "untagged"],
      ["Router's gateway", conf.PASS_GATEWAY],
      ["Lease", s.pass ? s.pass.address + " (DHCP)" : "none yet"],
    ] : mode === "router" ? [
      ["Stick's address", conf.LAN_ADDRESS],
      ["DHCP server", conf.LAN_DHCP === "on" ? `${conf.LAN_DHCP_START} - ${conf.LAN_DHCP_END}` : "off"],
    ] : [
      ["Traffic", "bridged to the PON"],
    ]),
  ]);
}

const STORE = {
  loaded: ["Saved in flash", "good"], saved: ["Saved in flash", "good"],
  defaults: ["Defaults, nothing saved", "warn"], failed: ["Not saved to flash", "bad"],
  none: ["No store", "warn"],
};

function devTile() {
  const img = last.image || {}, up = last.uptime, mem = last.memory, s = settingsValue();
  const store = STORE[s.store] || ["Unknown", ""];
  const used = mem ? Math.round(100 * (1 - mem.available_kb / mem.total_kb)) : null;
  const bank = banks && banks.rootfs ? banks.rootfs.bank : null;
  tile("t-dev", "Device", null, [
    big(up ? duration(up.up_s) : "-"),
    el("div", "Up since the last start", "caption"),
    rows([
      ["Software", img.build || img.version || "-"],
      ["Running from", bank === null ? "-" : "bank " + bank],
      ["Memory used", used === null ? "-" : used + " %"],
      ["Settings", chip(store[0], store[1])],
    ]),
  ]);
}

/* ---- traffic ---- */

function traffic(now) {
  const pc = last.port_counters, cpu = port("cpu");
  if (!pc || !pc.pon) return;
  /* The switch's own octet counts: rx_bytes and tx_bytes count the CPU path only. */
  const cur = { t: now, rx: pc.pon.rx_octets, tx: pc.pon.tx_octets,
                cpu: cpu && cpu.cpu_path ? cpu.cpu_path.rx_packets + cpu.cpu_path.tx_packets : null };
  if (prev && cur.t > prev.t && cur.rx >= prev.rx && cur.tx >= prev.tx) {
    const dt = (cur.t - prev.t) / 1000;
    const down = (cur.rx - prev.rx) * 8 / dt, upr = (cur.tx - prev.tx) * 8 / dt;
    const cpuFps = cur.cpu !== null && prev.cpu !== null ? (cur.cpu - prev.cpu) / dt : null;
    history.push({ down, up: upr });
    if (history.length > HISTORY) history.shift();
    const [dv, du] = rate(down), [uv, uu] = rate(upr);
    $("r-down").replaceChildren(document.createTextNode(dv), el("small", du));
    $("r-up").replaceChildren(document.createTextNode(uv), el("small", uu));
    const hw = $("r-hw");
    if (cpuFps === null) hw.textContent = "";
    else if (down + upr > 20e6 && cpuFps < 200)
      hw.replaceChildren(chip("In hardware", "good"),
        document.createTextNode(` the processor sees ${cpuFps.toFixed(0)} frames/s of this traffic`));
    else hw.replaceChildren(el("span", `Through the processor: ${cpuFps.toFixed(0)} frames/s`, "muted"));
    spark();
  }
  prev = cur;
}

function spark() {
  const svg = $("spark"), W = 600, H = 150, top = 14, bottom = H - 2;
  const peak = Math.max(10e6, ...history.map((h) => Math.max(h.down, h.up)));
  const scale = [10e6, 50e6, 100e6, 250e6, 500e6, 1e9, 2.5e9].find((x) => x >= peak) || peak;
  const x = (i) => W - (history.length - 1 - i) * (W / (HISTORY - 1));
  const y = (v) => bottom - (bottom - top) * v / scale;
  const line = (k) => history.map((h, i) => `${x(i).toFixed(1)},${y(h[k]).toFixed(1)}`).join(" ");
  const ns = "http://www.w3.org/2000/svg", mk = (tag, attrs) => {
    const e = document.createElementNS(ns, tag);
    Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
    return e;
  };
  const parts = [];
  [0, .5, 1].forEach((f) => {
    const yy = y(scale * f);
    parts.push(mk("line", { x1: 0, x2: W, y1: yy, y2: yy, class: "grid-line" }));
  });
  const lbl = mk("text", { x: 4, y: top - 3 });
  lbl.textContent = rate(scale).join(" ");
  parts.push(lbl);
  if (history.length > 1) {
    const d = line("down");
    parts.push(mk("polygon", { points: `${x(0)},${bottom} ${d} ${x(history.length - 1)},${bottom}`, class: "area" }));
    parts.push(mk("polyline", { points: d, class: "down" }));
    parts.push(mk("polyline", { points: line("up"), class: "up" }));
  }
  svg.replaceChildren(...parts);
}

/* ---- settings ---- */

const MODES = [
  { id: "bridge", name: "Bridge",
    text: "The operator's service passes through; your router connects itself." },
  { id: "passthrough", name: "Passthrough",
    text: "The stick dials PPPoE and hands the public address to your router, " +
          "which keeps NAT and the firewall. Forwarding runs in hardware." },
  { id: "router", name: "Router",
    text: "The stick connects itself and routes for one network behind it." },
];
const ROUTED = ["router", "passthrough"];
const GROUPS = [
  { title: "Internet connection", modes: ROUTED, fields: [
    { key: "WAN_PROTO", label: "Protocol", choices: ["pppoe", "dhcp", "static"], modes: ["router"] },
    { key: "PPPOE_USER", label: "PPPoE user name", proto: "pppoe" },
    { key: "PPPOE_SECRET", label: "PPPoE password", proto: "pppoe" },
    { key: "WAN_VLAN", label: "Operator VLAN", hint: "none, or 1 to 4094" },
    { key: "WAN_ADDRESS", label: "Address", hint: "a.b.c.d/length", modes: ["router"], proto: "static" },
    { key: "WAN_GATEWAY", label: "Gateway", hint: "a.b.c.d", modes: ["router"], proto: "static" },
    { key: "WAN_MAC", label: "MAC address the operator sees", hint: "none, or xx:xx:xx:xx:xx:xx" },
  ] },
  { title: "Link to your router", modes: ["passthrough"], fields: [
    { key: "LAN_VLAN", label: "VLAN of the link", hint: "none, or 1 to 4094" },
    { key: "PASS_GATEWAY", label: "Gateway given to your router", hint: "a.b.c.d" },
  ] },
  { title: "Your network", modes: ["router"], fields: [
    { key: "LAN_ADDRESS", label: "Stick's address", hint: "a.b.c.d/length" },
    { key: "LAN_DHCP", label: "DHCP server", choices: ["on", "off"] },
    { key: "LAN_DHCP_START", label: "DHCP range from", hint: "a.b.c.d" },
    { key: "LAN_DHCP_END", label: "DHCP range to", hint: "a.b.c.d" },
  ] },
  { title: "Advanced", modes: ROUTED, advanced: true, fields: [
    { key: "WAN_GEM", label: "WAN GEM port", hint: "auto, or a Port-ID" },
  ] },
];
const FIELDS = GROUPS.flatMap((g) => g.fields);
/* The input type that hides what is typed. */
const MASKED = "password";

function buildSettings() {
  const f = el("form");
  f.id = "f-settings";
  f.noValidate = true;
  const modes = el("div", undefined, "modes");
  MODES.forEach((m) => {
    const l = el("label", undefined, "mode"), r = el("input");
    r.type = "radio"; r.name = "MODE"; r.value = m.id;
    l.append(r, el("strong", m.name), el("span", m.text));
    modes.appendChild(l);
  });
  f.appendChild(modes);
  GROUPS.forEach((g) => {
    const fs = el("fieldset"), box = el("div", undefined, "fields");
    fs.dataset.modes = g.modes.join(" ");
    g.fields.forEach((d) => box.appendChild(field(d)));
    if (g.advanced) {
      const det = el("details", undefined, "adv");
      det.append(el("summary", g.title), box);
      fs.appendChild(det);
    } else {
      fs.append(el("legend", g.title), box);
    }
    f.appendChild(fs);
  });
  const actions = el("div", undefined, "actions");
  const go = el("button", "Save and apply", "primary"), undo = el("button", "Undo changes");
  go.type = "submit"; go.id = "s-go"; undo.type = "button";
  const state = el("span", "", "muted");
  state.id = "s-state";
  undo.onclick = () => { delete f.dataset.dirty; fillSettings(settingsValue(), true); state.textContent = ""; };
  actions.append(go, undo, state);
  f.append(actions, el("p", "Settings are saved in the stick's flash and kept across restarts. " +
    "Changing the mode restarts the PON service, and traffic stops for a few seconds.", "note"));
  const edited = () => { f.dataset.dirty = "1"; visibility(f); };
  f.addEventListener("input", edited);
  f.addEventListener("change", edited);
  f.onsubmit = (e) => { e.preventDefault(); applySettings(f); };
  $("settings").replaceChildren(f);
}

function field(d) {
  const w = el("div", undefined, "field"), label = el("label", d.label);
  let input;
  if (d.choices) {
    input = el("select");
    d.choices.forEach((c) => input.appendChild(el("option", c)));
  } else {
    const secret = d.key === "PPPOE_SECRET";
    input = el("input");
    input.type = secret ? MASKED : "text";
    input.autocomplete = secret ? "new-password" : "off";
    input.spellcheck = false;
    input.placeholder = d.hint || "";
  }
  input.id = label.htmlFor = "s-" + d.key;
  input.name = d.key;
  w.dataset.key = d.key;
  w.appendChild(label);
  if (d.key === "PPPOE_SECRET") {
    const row = el("div", undefined, "pw"), show = el("button", "Show");
    show.type = "button";
    show.onclick = () => {
      const reveal = input.type === MASKED;
      input.type = reveal ? "text" : MASKED;
      show.textContent = reveal ? "Hide" : "Show";
    };
    row.append(input, show);
    w.appendChild(row);
    w.appendChild(el("div", "", "hint")).id = "s-secret-hint";
  } else {
    w.appendChild(input);
  }
  return w;
}

function modeOf(f) { const r = f.querySelector("input[name=MODE]:checked"); return r ? r.value : "bridge"; }
/* The WAN's protocol as onu-mode takes it: PPPoE in passthrough mode. */
function wanProto(f) { return modeOf(f) === "passthrough" ? "pppoe" : f.elements.WAN_PROTO.value; }

function visibility(f) {
  const mode = modeOf(f), proto = wanProto(f);
  f.querySelectorAll("fieldset").forEach((fs) => { fs.hidden = !fs.dataset.modes.split(" ").includes(mode); });
  f.querySelectorAll(".field").forEach((w) => {
    const d = FIELDS.find((x) => x.key === w.dataset.key);
    w.hidden = (d.modes && !d.modes.includes(mode)) || (d.proto && d.proto !== proto);
  });
}

/* Fill the form from the daemon, unless someone is editing it. */
function fillSettings(v, force) {
  const f = $("f-settings");
  if (!f || !v.settings || (f.dataset.dirty && !force)) return;
  Object.entries(v.settings).forEach(([k, x]) => {
    if (k === "MODE") f.querySelectorAll("input[name=MODE]").forEach((r) => { r.checked = r.value === x; });
    else if (f.elements[k]) f.elements[k].value = x;
  });
  f.elements.PPPOE_USER.value = v.pppoe ? v.pppoe.user : "";
  f.elements.PPPOE_SECRET.value = "";
  const set = v.pppoe && v.pppoe.secret_set;
  f.elements.PPPOE_SECRET.placeholder = set ? "saved; leave empty to keep it" : "not set";
  $("s-secret-hint").textContent = set ? "A password is saved. Type a new one only to change it." : "";
  visibility(f);
}

async function applySettings(f) {
  const v = settingsValue(), mode = modeOf(f), state = $("s-state");
  const inForce = v.settings ? v.settings.MODE : null;
  if (inForce && mode !== inForce &&
      !confirm(`Change the mode from ${inForce} to ${mode}? Traffic stops for a few seconds.`)) return;
  const lines = ["MODE=" + mode];
  FIELDS.filter((d) => !d.key.startsWith("PPPOE_") && d.key !== "WAN_PROTO")
    .forEach((d) => lines.push(d.key + "=" + f.elements[d.key].value.trim()));
  lines.push("WAN_PROTO=" + wanProto(f));
  if (wanProto(f) === "pppoe") {
    const user = f.elements.PPPOE_USER.value.trim(), secret = f.elements.PPPOE_SECRET.value;
    if (user) lines.push("PPPOE_USER=" + user);
    if (secret) lines.push("PPPOE_SECRET=" + secret);
  }
  $("s-go").disabled = true;
  state.className = "muted";
  state.textContent = "Sending...";
  try {
    await api("/api/set/settings", lines.join("\n") + "\n");
    delete f.dataset.dirty;
    f.elements.PPPOE_SECRET.value = "";
    state.textContent = "Applying...";
    await settle(state);
  } catch (e) {
    state.className = "bad";
    state.textContent = e instanceof AuthError ? "The token was refused." : e.message;
  } finally {
    $("s-go").disabled = false;
  }
}

/* Wait for onu-mode to finish, then say how it ended. */
async function settle(state) {
  for (let i = 0; i < 40; i++) {
    await new Promise((r) => setTimeout(r, 1500));
    const v = (await api("/api/get/settings")).value;
    last.settings = v;
    if (v.applying) continue;
    fillSettings(v, true);
    render();
    if (v.last_apply_status === 0) {
      const saved = v.store === "saved";
      state.className = saved ? "good" : "warn";
      state.textContent = saved ? "Applied and saved in flash." : "Applied, but not saved in flash.";
    } else {
      state.className = "bad";
      state.textContent = `Applying failed (status ${v.last_apply_status}).`;
    }
    return;
  }
  state.className = "warn";
  state.textContent = "Still applying; the page shows the result when it is done.";
}

/* ---- diagnostics: every value, as tables ---- */

function scalar(v) {
  if (v === null || v === undefined) return "-";
  if (typeof v === "boolean") return v ? "yes" : "no";
  if (typeof v === "object") return JSON.stringify(v);
  return String(v);
}
function table(v) {
  if (Array.isArray(v)) {
    if (!v.length) return el("span", "none", "muted");
    if (v.every((x) => x && typeof x === "object" && !Array.isArray(x))) {
      const cols = [...new Set(v.flatMap(Object.keys))];
      const t = el("table"), head = t.insertRow();
      cols.forEach((c) => head.appendChild(el("th", c)));
      v.forEach((row) => { const tr = t.insertRow(); cols.forEach((c) => tr.insertCell().appendChild(cell(row[c]))); });
      return t;
    }
    return el("span", v.map(scalar).join(", "));
  }
  if (v && typeof v === "object") {
    if (v.error) return el("span", v.error + (v.detail ? ": " + v.detail : ""), "bad");
    const t = el("table");
    Object.entries(v).forEach(([k, x]) => {
      const tr = t.insertRow(), kc = tr.insertCell();
      kc.className = "k"; kc.textContent = k;
      tr.insertCell().appendChild(cell(x));
    });
    return t;
  }
  return el("span", scalar(v));
}
function cell(x) { return x && typeof x === "object" ? table(x) : el("span", scalar(x)); }

function buildDiag() {
  const body = $("diag-body");
  body.replaceChildren();
  [...new Set(schema.map((i) => i.cat))].forEach((cat) => {
    body.appendChild(el("div", cat, "dcat"));
    const g = el("div", undefined, "dgrid");
    schema.filter((i) => i.cat === cat && i.readable).forEach((i) => {
      const c = el("div", undefined, "card dcard"), h = el("h4", i.label);
      h.appendChild(el("small", i.id));
      const v = el("div", "...");
      v.id = "v-" + i.id;
      if (i.slow) {
        v.textContent = "";
        const b = el("button", "Read");
        b.onclick = async () => {
          v.textContent = "reading...";
          try { v.replaceChildren(table((await api("/api/get/" + encodeURIComponent(i.id))).value)); }
          catch (e) { v.replaceChildren(el("span", e.message, "bad")); }
        };
        v.appendChild(b);
      }
      c.append(h, v);
      g.appendChild(c);
    });
    body.appendChild(g);
  });
}
function diagValues() {
  if (!$("diag").open) return;
  schema.filter((i) => i.readable && !i.slow).forEach((i) => {
    const box = $("v-" + i.id);
    if (box) box.replaceChildren(last[i.id] === null ? el("span", "not on this unit", "muted") : table(last[i.id]));
  });
}

/* ---- the loop ---- */

function render() {
  fibreTile(); netTile(); linkTile(); devTile();
  fillSettings(settingsValue());
  diagValues();
  if (typeof last.model === "string" && last.model) {
    $("title").textContent = last.model;
    document.title = last.model;
  }
}

async function refresh() {
  const ids = schema.filter((i) => i.readable && !i.slow).map((i) => i.id);
  try {
    last = await api("/api/getm?ids=" + ids.join(","));
    traffic(Date.now());
    render();
    live("Live", "on", new Date().toLocaleTimeString());
  } catch (e) {
    if (e instanceof AuthError) return signin("The token was refused.");
    live(e.message, "err");
  }
}

function live(text, cls, time) {
  const l = $("live");
  l.hidden = false;
  l.className = cls;
  l.replaceChildren(document.createTextNode(text));
  if (time) l.appendChild(el("span", ", " + time, "time"));
}

function arm() {
  clearInterval(timer);
  timer = paused ? null : setInterval(refresh, REFRESH_MS);
  $("pause").textContent = paused ? "Resume" : "Pause";
  if (paused) live("Paused", "");
}

async function start() {
  try {
    schema = (await api("/api/schema")).items;
  } catch (e) {
    return signin(e instanceof AuthError ? "The token was refused." : e.message);
  }
  $("login").hidden = true;
  $("app").hidden = false;
  $("pause").hidden = $("signout").hidden = false;
  buildSettings();
  buildDiag();
  await refresh();
  arm();
  api("/api/get/banks").then((r) => { banks = r.value; devTile(); }).catch(() => {});
}

function signin(message) {
  clearInterval(timer);
  $("app").hidden = true;
  $("live").hidden = $("pause").hidden = $("signout").hidden = true;
  $("login").hidden = false;
  $("login-err").textContent = message || "";
  $("token").focus();
}

$("login-form").onsubmit = (e) => {
  e.preventDefault();
  token = $("token").value.trim();
  saveToken(token, $("remember").checked);
  $("token").value = "";
  start();
};
$("signout").onclick = () => { dropToken(); token = ""; signin(""); };
$("pause").onclick = () => { paused = !paused; arm(); if (!paused) refresh(); };
$("diag").addEventListener("toggle", diagValues);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) clearInterval(timer);
  else if (schema.length && !$("app").hidden) { prev = null; refresh(); arm(); }
});

if (token) start(); else signin("");
</script>
</body>
