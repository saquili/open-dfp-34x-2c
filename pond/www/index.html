<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONU status</title>
<style>
:root {
  --bg: #f6f7f9; --card: #fff; --fg: #1d2330; --dim: #5b6475; --line: #dde1e8;
  --accent: #2457c5; --bad: #b3261e; --good: #1e7a3c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --card: #1b2029; --fg: #e4e8ef; --dim: #98a2b3; --line: #2c3340;
    --accent: #7aa2ff; --bad: #ff8a80; --good: #7bd88f;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
  padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
header h1 { font-size: 17px; margin: 0; flex: 1 1 auto; }
header input { font: inherit; padding: 5px 8px; width: 16em; max-width: 100%;
  border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
button { font: inherit; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--fg); cursor: pointer; }
button:hover { border-color: var(--accent); }
main { padding: 12px 16px 32px; max-width: 1200px; margin: 0 auto; }
h2 { font-size: 15px; margin: 20px 0 8px; color: var(--dim); text-transform: uppercase;
  letter-spacing: .04em; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; overflow-x: auto; }
.card h3 { font-size: 14px; margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline; }
.card h3 small { color: var(--dim); font-weight: normal; }
table { border-collapse: collapse; width: 100%; }
td, th { text-align: left; padding: 2px 6px; border-top: 1px solid var(--line);
  vertical-align: top; font-variant-numeric: tabular-nums; }
th { color: var(--dim); font-weight: 600; }
td.k { color: var(--dim); white-space: nowrap; width: 1%; }
.err { color: var(--bad); }
.ok { color: var(--good); }
#state { color: var(--dim); }
form.settings { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 8px;
  margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
form.settings .row { display: contents; }
form.settings .row[hidden] { display: none; }
form.settings label { color: var(--dim); align-self: center; }
form.settings input, form.settings select { font: inherit; padding: 3px 6px; min-width: 0;
  border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
form.settings .wide { grid-column: 1 / -1; margin: 0; }
form.settings .note { color: var(--dim); font-size: 13px; }
form.settings button { justify-self: start; }
</style>
</head>
<body>
<header>
  <h1 id="title">ONU status</h1>
  <input id="token" type="password" placeholder="token" autocomplete="current-password"
         aria-label="The token of the status daemon">
  <button id="connect">Connect</button>
  <label><input id="auto" type="checkbox" checked> refresh every 5 s</label>
  <span id="state"></span>
</header>
<main id="main"><p>Give the token of this unit and connect.</p></main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
let schema = [], timer = null;

function store(key, value) {
  try { localStorage.setItem(key, value); }
  catch (e) { /* no storage: the token is asked for again */ }
}
function recall(key) {
  try { return localStorage.getItem(key) || ""; } catch (e) { return ""; }
}

/* A GET of the API, or a POST of body. */
async function api(path, body) {
  const opts = { headers: { Authorization: "Bearer " + $("token").value }, cache: "no-store" };
  if (body !== undefined) {
    opts.method = "POST";
    opts.headers["Content-Type"] = "text/plain";
    opts.body = body;
  }
  const r = await fetch(path, opts);
  const reply = await r.json().catch(() => ({ error: "not JSON", detail: r.statusText }));
  if (!r.ok) throw new Error((reply.error || r.status) + (reply.detail ? ": " + reply.detail : ""));
  return reply;
}

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

function scalar(v) {
  if (v === null || v === undefined) return "-";
  if (typeof v === "boolean") return v ? "yes" : "no";
  if (typeof v === "object") return JSON.stringify(v);
  return String(v);
}

/* A value as a table: an object by key, a list of objects by column. */
function render(v) {
  if (Array.isArray(v)) {
    if (!v.length) return el("span", "none");
    if (v.every((x) => x && typeof x === "object" && !Array.isArray(x))) {
      const cols = [...new Set(v.flatMap(Object.keys))];
      const t = el("table"), head = t.insertRow();
      cols.forEach((c) => head.appendChild(el("th", c)));
      v.forEach((row) => {
        const tr = t.insertRow();
        cols.forEach((c) => tr.insertCell().appendChild(cell(row[c])));
      });
      return t;
    }
    return el("span", v.map(scalar).join(", "));
  }
  if (v && typeof v === "object") {
    if (v.error) return el("span", v.error + (v.detail ? ": " + v.detail : ""), "err");
    const t = el("table");
    Object.entries(v).forEach(([k, x]) => {
      const tr = t.insertRow();
      tr.insertCell().appendChild(el("span", k)).parentNode.className = "k";
      tr.insertCell().appendChild(cell(x));
    });
    return t;
  }
  return el("span", scalar(v));
}

function cell(x) {
  return x && typeof x === "object" ? render(x) : el("span", scalar(x));
}

/*
 * The settings of the mode, as onu-mode reads them. A field names the modes
 * it matters in, and one marked with a protocol matters for that protocol of
 * the WAN only, which is PPPoE in passthrough mode; the form shows a field
 * only where it matters.
 */
const ROUTED = ["router", "passthrough"];
const FIELDS = [
  { key: "MODE", label: "Mode", choices: ["bridge", "router", "passthrough"] },
  { key: "WAN_PROTO", label: "WAN protocol", choices: ["dhcp", "pppoe", "static"], modes: ["router"] },
  { key: "WAN_GEM", label: "WAN GEM port", hint: "auto, or a Port-ID", modes: ROUTED },
  { key: "WAN_VLAN", label: "WAN VLAN", hint: "none, or 1 to 4094", modes: ROUTED },
  { key: "WAN_ADDRESS", label: "WAN address", hint: "a.b.c.d/length", modes: ["router"], proto: "static" },
  { key: "WAN_GATEWAY", label: "WAN gateway", hint: "a.b.c.d", modes: ["router"], proto: "static" },
  { key: "WAN_MAC", label: "WAN MAC address", hint: "none, or xx:xx:xx:xx:xx:xx", modes: ROUTED },
  { key: "PPPOE_USER", label: "PPPoE user", modes: ROUTED, proto: "pppoe" },
  { key: "PPPOE_SECRET", label: "PPPoE secret", modes: ROUTED, proto: "pppoe" },
  { key: "LAN_ADDRESS", label: "LAN address", hint: "a.b.c.d/length", modes: ["router"] },
  { key: "LAN_DHCP", label: "LAN DHCP server", choices: ["on", "off"], modes: ["router"] },
  { key: "LAN_DHCP_START", label: "DHCP range from", hint: "a.b.c.d", modes: ["router"] },
  { key: "LAN_DHCP_END", label: "DHCP range to", hint: "a.b.c.d", modes: ["router"] },
  { key: "LAN_VLAN", label: "Router link VLAN", hint: "none, or 1 to 4094", modes: ["passthrough"] },
  { key: "PASS_GATEWAY", label: "Router's gateway", hint: "a.b.c.d", modes: ["passthrough"] },
];

/* The WAN's protocol as onu-mode takes it: PPPoE in passthrough mode. */
function wanProto(f) {
  return f.elements.MODE.value === "passthrough" ? "pppoe" : f.elements.WAN_PROTO.value;
}

function settingsForm() {
  const f = el("form", undefined, "settings");
  f.id = "f-settings";
  FIELDS.forEach((d) => {
    const row = el("div", undefined, "row"), label = el("label", d.label);
    let input;
    if (d.choices) {
      input = el("select");
      d.choices.forEach((c) => input.appendChild(el("option", c)));
    } else {
      input = el("input");
      input.type = "text";
      input.autocomplete = "off";
      input.placeholder = d.hint || "";
      if (d.key === "PPPOE_SECRET") {
        input.type = "password";
        input.autocomplete = "new-password";
      }
    }
    input.id = label.htmlFor = "s-" + d.key;
    input.name = d.key;
    row.dataset.key = d.key;
    row.append(label, input);
    f.appendChild(row);
  });
  const go = el("button", "Apply"), state = el("p", "", "wide");
  go.type = "submit";
  state.id = "s-state";
  f.append(el("p", "The settings are held in RAM: the next boot returns to those of the " +
                   "image. A change of mode restarts omcid, and the data path stops for a " +
                   "few seconds.", "wide note"), go, state);
  const edited = () => { f.dataset.dirty = "1"; visibility(f); };
  f.addEventListener("input", edited);
  f.addEventListener("change", edited);
  f.onsubmit = (e) => { e.preventDefault(); applySettings(f); };
  return f;
}

function visibility(f) {
  const mode = f.elements.MODE.value, proto = wanProto(f);
  f.querySelectorAll(".row").forEach((row) => {
    const d = FIELDS.find((x) => x.key === row.dataset.key);
    row.hidden = (d.modes && !d.modes.includes(mode)) || (d.proto && d.proto !== proto);
  });
}

/* Fill the form from the daemon, unless someone is editing it. */
function fillSettings(v) {
  const f = $("f-settings");
  if (!f || f.dataset.dirty) return;
  Object.entries(v.settings).forEach(([k, x]) => { if (f.elements[k]) f.elements[k].value = x; });
  f.elements.PPPOE_USER.value = v.pppoe.user;
  f.elements.PPPOE_SECRET.value = "";
  f.elements.PPPOE_SECRET.placeholder = v.pppoe.secret_set ? "set; empty keeps it" : "not set";
  visibility(f);
}

async function applySettings(f) {
  const lines = FIELDS.filter((d) => !d.key.startsWith("PPPOE_") && d.key !== "WAN_PROTO")
    .map((d) => d.key + "=" + f.elements[d.key].value.trim());
  lines.push("WAN_PROTO=" + wanProto(f));
  if (wanProto(f) === "pppoe") {
    const user = f.elements.PPPOE_USER.value.trim(), secret = f.elements.PPPOE_SECRET.value;
    if (user) lines.push("PPPOE_USER=" + user);
    if (secret) lines.push("PPPOE_SECRET=" + secret);
  }
  const state = $("s-state");
  state.className = "wide";
  state.textContent = "sending...";
  try {
    await api("/api/set/settings", lines.join("\n") + "\n");
    delete f.dataset.dirty;
    f.elements.PPPOE_SECRET.value = "";
    state.className = "wide ok";
    state.textContent = "taken; onu-mode applies it now";
    setTimeout(() => one("settings"), 2000);
  } catch (e) {
    state.className = "wide err";
    state.textContent = e.message;
  }
}

function card(item) {
  const c = el("div", undefined, "card");
  const h = el("h3", item.label);
  h.appendChild(el("small", item.id));
  c.appendChild(h);
  const body = el("div", "...");
  body.id = "v-" + item.id;
  c.appendChild(body);
  if (item.slow) {
    body.textContent = "";
    const b = el("button", "Read");
    b.onclick = () => one(item.id);
    body.appendChild(b);
  }
  if (item.writable && item.id === "settings") c.appendChild(settingsForm());
  return c;
}

function show(id, value) {
  const box = $("v-" + id);
  if (!box) return;
  if (id === "settings" && value && value.settings) {
    /* The settings go to the form; the card shows what is in force. */
    fillSettings(value);
    const { settings, pppoe, ...state } = value;
    value = state;
  }
  box.replaceChildren(value === null ? el("span", "not on this unit") : render(value));
}

async function one(id) {
  try { show(id, (await api("/api/get/" + encodeURIComponent(id))).value); }
  catch (e) { $("v-" + id).replaceChildren(el("span", e.message, "err")); }
}

async function refresh() {
  const ids = schema.filter((i) => i.readable && !i.slow).map((i) => i.id);
  try {
    const values = await api("/api/getm?ids=" + ids.join(","));
    ids.forEach((id) => show(id, values[id]));
    $("state").textContent = "updated " + new Date().toLocaleTimeString();
    $("state").className = "ok";
    if (values.model && values.model.model) $("title").textContent = values.model.model;
  } catch (e) {
    $("state").textContent = e.message;
    $("state").className = "err";
  }
}

async function connect() {
  store("pond-token", $("token").value);
  try {
    schema = (await api("/api/schema")).items;
  } catch (e) {
    $("main").replaceChildren(el("p", e.message, "err"));
    return;
  }
  const main = $("main");
  main.replaceChildren();
  const cats = [...new Set(schema.map((i) => i.cat))];
  cats.forEach((cat) => {
    main.appendChild(el("h2", cat));
    const g = el("div", undefined, "grid");
    schema.filter((i) => i.cat === cat && i.readable).forEach((i) => g.appendChild(card(i)));
    main.appendChild(g);
  });
  await refresh();
  arm();
}

function arm() {
  clearInterval(timer);
  timer = $("auto").checked && schema.length ? setInterval(refresh, 5000) : null;
}

$("connect").onclick = connect;
$("auto").onchange = arm;
$("token").addEventListener("keydown", (e) => { if (e.key === "Enter") connect(); });
$("token").value = recall("pond-token");
if ($("token").value) connect();
</script>
</body>
</html>
