#
# Justified exceptions to the provenance gates (tools/provenance/check).
#
# Every entry names the gate it relaxes, narrows where it applies, and says
# why the exception is right. An entry cannot switch a gate off: it must name
# paths, commits, values, hashes or a match. A binaries entry also states
# where the file comes from. The format is described in README.rst.

# --- Files that must name what they forbid ----------------------------------

[[allow]]
gate = "forbidden-words"
rules = ["re-tool", "nonpublic-material", "dev-kit", "narrative"]
paths = ["docs/policy/provenance.rst"]
reason = """
The provenance policy defines the categories of material that may not enter
the repository, so its text has to name them. It is normative and changes
only as policy.
"""

[[allow]]
gate = "forbidden-words"
rules = ["re-tool"]
paths = ["CONTRIBUTING.rst"]
reason = """
The contribution guide lists the vocabulary a commit message must not
contain, pointing to the policy; it has to name that vocabulary to do so.
"""

[[allow]]
gate = "forbidden-words"
rules = ["re-tool", "narrative", "dev-kit", "board-package", "nonpublic-material",
         "source-collection", "lab-path"]
paths = ["tools/provenance/gates/rules.py", "tools/provenance/README.rst"]
reason = """
The gate's own rule definitions and their documentation: the patterns, the
vocabulary exceptions and the explanation of each rule spell out the words
the rules refuse.
"""

[[allow]]
gate = "forbidden-words"
rules = ["board-package"]
paths = ["docs/adr/0005-distribution-build-buildroot.rst"]
reason = """
The record weighs distribution build systems and names the board-support
layer convention of one of them generically; it refers to no party's code.
Accepted records are immutable, so the exception cannot widen.
"""

# --- Values that have the shape of a finding but are not one ---------------

[[allow]]
gate = "forbidden-words"
rules = ["code-address"]
values = ["0x80000000", "0x800003ff", "0x80040000", "0x80100000"]
reason = """
Memory-map constants of the MIPS architecture, not code addresses: the base
of the unmapped, cached kernel segment (KSEG0), the last byte of the
exception-vector area at its start, and the two kernel load addresses the
upstream MIPS tree uses above that area.
"""

# --- History that predates the gates ----------------------------------------

[[allow]]
gate = "commit-message"
rules = ["subject-prefix", "body-line-length"]
commits = [
    "f9aad8a876201d3f872d626b74c884bf072fda1d",
    "c69daae4d46f3076e4de9dac3b73e8cecf176905",
    "1a14e501b20f11d16e5cac04146d6c979b73de5d",
    "11d9c9446f9d94afa1a40e2ea92083f94b7c1422",
]
reason = """
The four founding commits were written before the commit-message gate
existed: three subjects lack a component prefix and some body lines run one
or two columns past 75. Published history is never rewritten (ADR 0007), so
these commits are accepted as they are; later commits follow the rule.
"""

[[allow]]
gate = "one-component"
commits = ["11d9c9446f9d94afa1a40e2ea92083f94b7c1422"]
reason = """
The skeleton commit created the placeholder README of every top-level
directory at once, founding the component layout that this rule protects. It
adds nothing but those placeholders and the MAINTAINERS file.
"""

# --- Third-party code carried unchanged -------------------------------------

[[allow]]
gate = "forbidden-words"
rules = ["code-address"]
paths = ["onu-utils/src/sha256.c"]
match = "0x80deb1f[e]"
reason = """
A round constant of SHA-256, the fractional part of the cube root of a prime
as FIPS 180-4 lists it, which only looks like a kernel-segment address. The
pattern spells the constant so that this file does not hold it.
"""

[[allow]]
gate = "forbidden-words"
rules = ["issue-reference", "narrative", "dev-kit", "code-address"]
paths = ["pond/third_party/mongoose/mongoose.c", "pond/third_party/mongoose/mongoose.h"]
reason = """
Mongoose 7.16 by Cesanta Software, carried as it comes under the GPL-2.0 arm
of its licence. Its comments cite issues of its own public tracker and name
the platforms it builds for, and its code holds protocol constants that look
like addresses; none of it is this project's prose or code.
"""

[[allow]]
gate = "unit-ids"
rules = ["ipv4-address", "ipv6-address"]
paths = ["pond/third_party/mongoose/mongoose.c", "pond/third_party/mongoose/mongoose.h"]
reason = """
Mongoose's own defaults and examples: public resolvers and sample addresses
in its code and comments. They identify no unit of this project.
"""

[[allow]]
gate = "denylist"
rules = ["symbol"]
paths = ["pond/third_party/mongoose/mongoose.c"]
reason = """
Mongoose names the MD5 functions of the public reference implementation in
a comment; the names are common to many programs.
"""

[[allow]]
gate = "binaries"
rules = ["file-size"]
paths = ["pond/third_party/mongoose/mongoose.c"]
provenance = """
Mongoose 7.16, mongoose.c as released by Cesanta Software, with an SPDX line
naming the GPL-2.0 arm of its licence added at the top.
"""
reason = """
Mongoose ships as one source file, larger than the cap; it is kept whole so
that it can be compared with the release.
"""

[[allow]]
gate = "unit-ids"
rules = ["ipv4-address"]
paths = [
  "onu-utils/scripts/onu-mode",
  "onu-utils/src/settings.c",
  "onu-utils/tests/test_settings.c",
  "onu-utils/tests/test_onucfg_settings.sh",
  "br2-external/board/dfp-34x-2c3/overlay/etc/onu.conf",
  "pond/src/prov_settings.c",
]
reason = """
The default LAN of router mode, a private /24 with the stick at .1 and its
DHCP server giving out .100 to .199: a private range on purpose, since a
router's LAN must not use the documentation ranges. It identifies no unit.
The table of the settings holds it, and its tests check it; pond held it
before the table did.
"""

[[allow]]
gate = "unit-ids"
rules = ["ipv4-address"]
paths = [
  "pond/web/src/lib/state.ts",
  "pond/web/src/pages/Lan.tsx",
  "pond/web/src/mocks/handlers.ts",
]
match = '192\.168\.\d{1,3}\.\d{1,3}(?:/24)?'
reason = """
The panel's side of the same default LAN: its defaults and the placeholders
of its form, the next networks it proposes (192.168.N.0/24), the widest such
address, which sizes a column, and the mock stick's local networks with their
devices, which stand for what a stick in router mode has. Private on purpose,
as a router's LAN; they identify no unit.
"""

[[allow]]
gate = "unit-ids"
rules = ["host-name"]
paths = ["pond/web/src/components/AppShell.tsx"]
match = '"nav\.lan"'
reason = """
The key of the menu's translation for the local network page, a property path
of the panel's messages, not a host name under a private top-level name.
"""

[[allow]]
gate = "forbidden-words"
rules = ["issue-reference"]
paths = ["docs/testing/*"]
match = '#\d+ (?:[A-Z_]+ )*(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun) (?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) '
reason = """
The records of the device tests quote the kernel's version as uname -v prints
it, which starts with the count of the build that made the kernel ("#14 Fri
Oct  2 ..."); it names no issue of any tracker.
"""

[[allow]]
gate = "unit-ids"
rules = ["ipv4-address"]
paths = ["tests/device/devtest/tests/test_devtest.py", "tools/provenance/allowlist.toml"]
values = ["10.11.12.13", "172.16.1.1", "8.8.8.8"]
reason = """
The test of a record's redaction gives it addresses outside the documentation
ranges, a private one of each kind and a public resolver, which the redaction
must take out; they name no unit and no bench. This entry names them too.
"""

[[allow]]
gate = "unit-ids"
rules = ["ipv6-address"]
paths = ["tests/device/devtest/tests/test_devtest.py", "tools/provenance/allowlist.toml"]
values = ["fe80::200:5eff:fe00:5301", "2001:4860:4860::8888"]
reason = """
The test of a record's redaction gives it IPv6 addresses outside the
documentation prefix, a link-local one made from a documentation MAC address
and a public resolver's, which the redaction must take out; they name no unit
and no bench. This entry names them too.
"""

[[allow]]
gate = "unit-ids"
rules = ["password"]
paths = ["pond/web/src/*", "pond/tests/test_prov.c"]
match = "[Ll][Oo][Ii][Dd].*"
reason = """
The logical ONU ID is an identifier an operator may register a line by, which
the owner sets in the status daemon's panel as the serial number is set. These
lines name the field, map it to the daemon's key, or carry a made-up value in
a test; none holds a unit's identifier, and the logical password beside it is
never served.
"""
