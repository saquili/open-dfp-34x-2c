#
# The settings of the stick's data path, which onu-apply applies, and what each
# key means. At boot, onu-config load writes the settings saved in the
# configuration store to /run/onu.conf, and onu-apply copies this file there
# only when there are none: the image sets none here, and a bench's image may
# set some. A change made in the panel is tried, and once it is confirmed it is
# saved in the store (onu-config, onu-apply). Each line is KEY=value; a value
# holds letters, digits and . / : _ - only, but for a name (LANn_NAME,
# FIXEDn_NAME, FORWARDn_NAME, RULEn_NAME), which is for people, any printable
# text, and which onu-apply does not read, and for name servers (IPOEn_DNS),
# one blank apart.
#
# The default of a key is not written here: it is the table of onu-utils
# (settings.h), the one place that says it, and "onu-config defaults" prints
# it. A key that is not set has its default.

# There is no mode to choose. Without a PPPoE account the OLT's provisioning
# connects the host link to the PON. With one, the stick holds that session
# itself and hands its IPv4 address to the router behind it, by DHCP, while
# the OLT's provisioning still carries the rest. The account of session N, 1
# to 7, is /run/onu-pppoeN ("user secret").

# The sessions, for N from 1 to 7: the Port-ID of the GEM port, or auto for the
# one the OLT lets the session's VLAN through (else the lowest that carries
# both ways and is no multicast port); a
# VLAN on it, the operator's VID for the service, which the OLT may translate,
# or nothing; the MAC address to send from, or nothing for the stick's own made
# locally administered, which keeps the PON side's address apart from the host
# link's (sessions in one VLAN share the first's); the families, ipv4, ipv6 or
# both; whether the session hands its address down to the router behind the
# stick, on, or keeps it on the stick, off; and the VLAN of the host link it
# hands it down in, nothing for the session's own VLAN, or untagged for none.
# In one VLAN to the host the first session that hands down and carries IPv4
# hands its address down, and the first that carries IPv6 its prefix; an
# operator that gives IPv6 on a session of its own gets one with ipv6.

# The connections that take their address as a router does (IPoE), for N
# from 1 to 7, sessions with an account and these seven at most together:
# the kind, static for an address typed in, dhcp for one from the operator's
# DHCP server, or nothing for none; the GEM port, the VLAN, which no other of
# these connections has, and the MAC address, as a session's (a session in
# the VLAN shares its interface); the families, ipv4, ipv6 or both; and for a
# static connection the address with its prefix length, 8 to 32 bits, the
# gateway, the name servers, and the IPv6 address with its length, its
# gateway and the prefix of the networks behind the stick. The gateway is
# another address of the address's network; of an address alone, a /32, as
# some operators give it, or of a /31 (both of whose addresses are hosts'),
# it may be any other host's, which the stick reaches on the link. A
# connection by DHCP asks for IPv4 alone: the stick has no DHCPv6 client for
# it.
#IPOE1_KIND=static
#IPOE1_GEM=auto
#IPOE1_VLAN=420
#IPOE1_MAC=
#IPOE1_FAMILY=ipv4
#IPOE1_ADDRESS=192.0.2.10/24
#IPOE1_GATEWAY=192.0.2.1
#IPOE1_DNS=198.51.100.53 198.51.100.54
#IPOE1_ADDRESS6=
#IPOE1_GATEWAY6=
#IPOE1_PREFIX6=

# The local networks the stick routes for the devices behind it, for N from 1
# to 8: the connection it goes out by, pppoe:N, a session that keeps its
# address on the stick (SESSIONn_PASS=off), or ipoe:N, whose NAT the devices
# go out through; a name; the VLAN on the host link, or nothing for untagged, which no
# session hands an address down in; the stick's address in the network with
# its prefix length (192.168.10.1/24); whether its DHCP server leases addresses,
# on or off; the first and the last address it leases, and for how many
# seconds; and, for IPv6, on or off, and the /64 of the connection's
# prefix, in hexadecimal. A network without a connection is none.
#LAN1_CONN=pppoe:1
#LAN1_NAME=Home
#LAN1_VLAN=10
#LAN1_ADDRESS=192.168.10.1/24
#LAN1_DHCP=on
#LAN1_POOL_FROM=192.168.10.100
#LAN1_POOL_TO=192.168.10.199
#LAN1_LEASE=86400
#LAN1_IPV6=off
#LAN1_IPV6_SUBNET=

# The fixed addresses, for N from 1 to 512: network/MAC/address, the address
# the network's DHCP server always gives the device; and a name.
#FIXED1=1/00:00:5e:00:53:a1/192.168.10.10
#FIXED1_NAME=Printer

# The ports forwarded from the internet, for N from 1 to 96: the connection
# they come in by; tcp, udp or both; a port, or the first and the last of a
# range; the device, by its network, which goes out by the connection, and
# its MAC address, which has a fixed address there; the device's port, for a
# range the first of as many, the range's own or others; and on, or off for
# one kept but not in force. And a name. The ranges moved to other ports, of
# the forwards that are on, move 1024 ports at most, a range of both
# protocols twice: each port is an entry of a map in the stick's table.
#FORWARD1=pppoe:1/tcp/443/1/00:00:5e:00:53:a1/443/on
#FORWARD1_NAME=Web server
#FORWARD2=pppoe:1/both/8000-8010/1/00:00:5e:00:53:a1/9000/on

# A connection's DMZ, for N from 1 to 7: the connection, and the device, as a
# forward's, that takes what comes in by it that no forward takes, a ping
# too, but DHCP's answers, which stay with the stick, as do the answers to
# what the stick itself sent.
#DMZ1=pppoe:1/1/00:00:5e:00:53:a1

# The firewall's rules, for N from 1 to 96, in the order they are judged in,
# the first that traffic matches deciding, each one line of fields apart by
# '_': an ID, 1 to 96, that names the rule wherever it moves; allow or block;
# where the traffic comes from and where it goes to, each internet,
# internet:ADDR (an IPv4 or IPv6 address, or a network ADDR/LEN), lans for
# every network, lan:N for one, or dev:N:MAC for a device of one, which has a
# fixed address there when the traffic goes to it; any, tcp, udp, both or
# icmp; the port or the range of ports it goes to, of TCP or UDP, or nothing
# for every one; any, ipv4 or ipv6; and on, or off for one kept but not in
# force. And a name, up to 40 characters. A rule goes from somewhere to
# somewhere else, never from the internet to the internet nor within one
# network. The rules are the switch's ACL's (ADR 0019); one that allows lets
# a new connection of IPv4 through the defaults below as well. A rule of
# IPv6 has no effect until the stick routes IPv6 to the networks' devices.
# From the internet a rule reaches a device by the ports of its forwards and
# its DMZ; /run/onu-fw.acl says of each rule whether it is in the switch.
#RULE1=1_allow_lan:2_dev:1:00:00:5e:00:53:a1_tcp_9100_any_on
#RULE1_NAME=The office printer
#RULE2=2_block_lans_internet_tcp_25_any_on
#RULE3=3_allow_internet:203.0.113.0/24_lan:1_any__ipv4_off

# What the firewall does with a new connection where no rule decides: from
# the networks to the internet, allow or block, and between two networks,
# allow or block. One from the internet into a network is always blocked,
# but what a forward or a DMZ takes.
#FW_OUT=allow
#FW_BETWEEN=block

# Whether the stick answers a ping, allow or block, in every mode: from the
# operator's side, by its sessions and IPoE connections, and from the host
# side's networks, the local networks and the links a session hands its
# address down by. On the management VLAN it answers whatever these say;
# its servers answer there alone.
#FW_PING_IN=block
#FW_PING_LANS=block
