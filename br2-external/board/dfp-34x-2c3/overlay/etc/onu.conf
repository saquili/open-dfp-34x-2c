#
# The settings of the stick's data path, which onu-apply applies, and what each
# key means. At boot, onu-config load writes the settings saved in the
# configuration store to /run/onu.conf, and onu-apply copies this file there
# only when there are none: the image sets none here, and a bench's image may
# set some. A change made in the panel is tried, and once it is confirmed it is
# saved in the store (onu-config, onu-apply). Each line is KEY=value; a value
# holds letters, digits and . / : _ - only, but for a name (LANn_NAME,
# FIXEDn_NAME), which is for people, any printable text, and which onu-apply
# does not read.
#
# The default of a key is not written here: it is the table of onu-utils
# (settings.h), the one place that says it, and "onu-config defaults" prints
# it. A key that is not set has its default.

# There is no mode to choose. Without a PPPoE account the OLT's provisioning
# connects the host link to the PON. With one, the stick holds that session
# itself and hands its IPv4 address to the router behind it, by DHCP, while
# the OLT's provisioning still carries the rest. The account of session N, 1
# to 7, is /run/onu-pppoeN ("user secret").

# The sessions, for N from 1 to 7: the Port-ID of the GEM port, or auto for the
# one the OLT lets the session's VLAN through (else the lowest that carries
# both ways and is no multicast port); a
# VLAN on it, the operator's VID for the service, which the OLT may translate,
# or nothing; the MAC address to send from, or nothing for the stick's own made
# locally administered, which keeps the PON side's address apart from the host
# link's (sessions in one VLAN share the first's); the families, ipv4, ipv6 or
# both; whether the session hands its address down to the router behind the
# stick, on, or keeps it on the stick, off; and the VLAN of the host link it
# hands it down in, nothing for the session's own VLAN, or untagged for none.
# In one VLAN to the host the first session that hands down and carries IPv4
# hands its address down, and the first that carries IPv6 its prefix; an
# operator that gives IPv6 on a session of its own gets one with ipv6.

# The local networks the stick routes for the devices behind it, for N from 1
# to 8: the connection it goes out by, pppoe:N, a session that keeps its
# address on the stick (SESSIONn_PASS=off), whose NAT the devices go out
# through; a name; the VLAN on the host link, or nothing for untagged, which no
# session hands an address down in; the stick's address in the network with
# its prefix length (192.168.1.1/24); whether its DHCP server leases addresses,
# on or off; the first and the last address it leases, and for how many
# seconds; and, for IPv6, on or off, and the /64 of the session's delegated
# prefix, in hexadecimal. A network without a connection is none.
#LAN1_CONN=pppoe:1
#LAN1_NAME=Dom
#LAN1_VLAN=100
#LAN1_ADDRESS=192.168.1.1/24
#LAN1_DHCP=on
#LAN1_POOL_FROM=192.168.1.100
#LAN1_POOL_TO=192.168.1.199
#LAN1_LEASE=86400
#LAN1_IPV6=off
#LAN1_IPV6_SUBNET=

# The fixed addresses, for N from 1 to 512: network/MAC/address, the address
# the network's DHCP server always gives the device; and a name.
#FIXED1=1/00:00:5e:00:53:a1/192.168.1.10
#FIXED1_NAME=Drukarka
