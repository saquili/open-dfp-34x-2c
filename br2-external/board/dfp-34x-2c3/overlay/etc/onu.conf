#
# The settings of the stick's mode, which onu-mode applies. The boot script
# copies this file to /run/onu.conf, which the status daemon rewrites; a change
# there lasts until the next restart. Each line is KEY=value; a value holds
# letters, digits and . / : _ - only.

# bridge: the OLT's provisioning connects the host link to the PON.
# router: the stick routes between the LAN on the host link and a WAN on a
# GEM port of the OLT's; it translates no address.
# passthrough: router mode with the WAN's PPPoE session opened by the stick
# and its IPv4 address handed to the router behind it, by DHCP.
MODE=bridge

# Router and passthrough mode, the WAN: the Port-ID of its GEM port, or auto
# for the lowest but 4095; a VLAN on it, or nothing; pppoe, dhcp or static,
# and pppoe whatever this says in passthrough mode. PPPoE takes its user and
# secret from /run/onu-pppoe ("user secret"); static takes WAN_ADDRESS, as
# address/prefix, and WAN_GATEWAY. WAN_MAC is the MAC address the WAN sends
# from, or nothing for its interface's own.
WAN_GEM=auto
WAN_VLAN=
WAN_PROTO=dhcp
WAN_ADDRESS=
WAN_GATEWAY=
WAN_MAC=

# Router mode, the LAN on the host link: its address and its DHCP server.
LAN_ADDRESS=192.168.1.1/24
LAN_DHCP=on
LAN_DHCP_START=192.168.1.100
LAN_DHCP_END=192.168.1.199

# Passthrough mode, the link to the router: a VLAN on the host link, or
# nothing for the host link itself; and the stick's address on it, the
# gateway the router is given with the session's address.
LAN_VLAN=
PASS_GATEWAY=169.254.0.1
