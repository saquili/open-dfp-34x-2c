#
# The settings of the stick's data path, which onu-mode applies. The boot
# script copies this file to /run/onu.conf, which the status daemon rewrites; a
# change there lasts until the next restart. Each line is KEY=value; a value
# holds letters, digits and . / : _ - only.

# Without a PPPoE account the OLT's provisioning connects the host link to
# the PON. With one, the stick holds that session itself and hands its IPv4
# address to the router behind it, by DHCP. The account of session N, 1 to 7,
# is /run/onu-pppoeN ("user secret"). router, kept for the bench, makes the
# stick route between the LAN on the host link and a WAN on a GEM port of the
# OLT's, translating no address; nothing else need be said here.
MODE=

# The sessions, for N from 1 to 7: the Port-ID of the GEM port, or auto for the
# one the OLT lets the session's VLAN through (else the lowest but 4095); a VLAN
# on it, the operator's VID for the service, which the OLT may translate, or
# nothing; the MAC address to send from, or nothing for the interface's own
# (sessions in one VLAN share the first's); and the families, ipv4, ipv6 or
# both. The first session that carries IPv4 hands its address on; an operator
# that gives IPv6 on a session of its own gets one with ipv6.
SESSION1_GEM=auto
SESSION1_VLAN=
SESSION1_MAC=
SESSION1_FAMILY=both

# Router mode, the WAN: the Port-ID of its GEM port, or auto for the lowest
# but 4095; a VLAN on it, or nothing; pppoe, dhcp or static. PPPoE takes the
# account of session 1; static takes WAN_ADDRESS, as address/prefix, and
# WAN_GATEWAY. WAN_MAC is the MAC address the WAN sends from, or nothing for
# its interface's own.
WAN_GEM=auto
WAN_VLAN=
WAN_PROTO=dhcp
WAN_ADDRESS=
WAN_GATEWAY=
WAN_MAC=

# Router mode, the LAN on the host link: its address and its DHCP server.
LAN_ADDRESS=192.168.1.1/24
LAN_DHCP=on
LAN_DHCP_START=192.168.1.100
LAN_DHCP_END=192.168.1.199

# With a session, the link to the router: a VLAN on the host link, or
# nothing for the host link itself; the stick's address on it; and the
# gateway the router is given with the session's address: on, the
# concentrator's address, as the router would have it with a session of its
# own, or off, the stick's address.
LAN_VLAN=
PASS_GATEWAY=169.254.0.1
PASS_PEER=on
