#
# The packet filter of the stick. The boot script loads it before any server
# listens. It says what the stick accepts for itself and what it forwards when
# it routes. It translates no address and offloads no flow: those rules name
# the interfaces of the PON side, the GEM ports and the PPP link, which exist
# only once the OLT has provisioned the stick, so a file in the image cannot
# name them.
#
# The host side is the interface sfp and its management VLAN, mgmt.

flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;

		iif lo accept
		ct state established,related accept

		# IPv6 does not work without ICMPv6: neighbour discovery, router
		# advertisements and path MTU discovery are ICMPv6 messages.
		meta l4proto ipv6-icmp accept

		# Of ICMP for IPv4: echo, and the two errors that path MTU
		# discovery and traceroute need.
		icmp type { echo-request, destination-unreachable, time-exceeded } accept

		# The servers of the stick, ssh and the status daemon, from the
		# host side only.
		iifname { "sfp", "mgmt" } tcp dport { 22, 8080 } accept

		# DHCP and DHCPv6, for a client (68, 546) and for a server (67,
		# 547) on the stick.
		udp dport { 67, 68, 546, 547 } accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;

		# When the stick routes, connections start on the host side; from
		# the PON side come only their replies.
		ct state established,related accept
		iifname { "sfp", "mgmt" } accept
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
