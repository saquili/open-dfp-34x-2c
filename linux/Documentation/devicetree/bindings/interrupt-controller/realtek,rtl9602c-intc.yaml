%YAML 1.2
---
$id: http://devicetree.org/schemas/interrupt-controller/realtek,rtl9602c-intc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL9602C interrupt controller

maintainers:
  - Paweł Phan <szop.hektar_1w@icloud.com>

description: |
  The interrupt controller of the Realtek RTL9602C sits between the SoC's
  peripherals and the CPU's interrupt lines. It takes 64 sources in two banks
  of 32, each bank with an enable and a status register. A status bit is set
  while its source asserts, whether the source is enabled or not, and clears
  when the device that raised it is serviced: there is no acknowledge
  register, and the sources are level-sensitive.

  Sources 32 to 63 reach the CPU only while source 12 of the lower bank is
  enabled as well, and the status bit of source 12 is set while any of them is
  pending.

  Routing registers in the controller, not the wiring, select the CPU
  interrupt line the sources are delivered on, so the node has the CPU's
  interrupt controller as its parent but no interrupts property.

properties:
  compatible:
    const: realtek,rtl9602c-intc

  reg:
    maxItems: 1

  interrupt-controller: true

  '#interrupt-cells':
    description: The source number, 0 to 63.
    const: 1

required:
  - compatible
  - reg
  - interrupt-controller
  - '#interrupt-cells'

additionalProperties: false

examples:
  - |
    interrupt-controller@18003000 {
        compatible = "realtek,rtl9602c-intc";
        reg = <0x18003000 0x100>;
        interrupt-controller;
        #interrupt-cells = <1>;
        interrupt-parent = <&cpuintc>;
    };
