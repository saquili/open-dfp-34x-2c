%YAML 1.2
---
$id: http://devicetree.org/schemas/net/dsa/realtek,rtl9602c-switch.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL9602C Ethernet switch

maintainers:
  - Paweł Phan <szop.hektar_1w@icloud.com>

description: |
  The Ethernet switch of the Realtek RTL9602C, a SoC for GPON optical network
  units (ONUs). Its register window also holds the chip's GPON MAC, the PON
  MAC with its packet buffer, an L3/NAT forwarding engine, an IEEE 1588 clock
  and two I2C masters.

  The switch has four ports. Port 0 is a SerDes lane to the host, 1000BASE-X
  or 2500BASE-X; port 1 exists in the silicon and is left out where it is not
  wired; port 2 is the PON port, behind which the GPON MAC sits; port 3 is the
  CPU port, whose conduit is the CPU port's DMA engine (realtek,rtl9602c-eth).
  Ports 0, 2 and 3 have no PHY and are described as fixed links.

  The PON MAC needs the system controller and the two DRAM areas of its packet
  buffer, given by realtek,sysctl and memory-region.

  The optics of the ONU, a laser driver such as the Semtech GN25L95, sit on the
  bus of the I2C master that the i2c node describes, and the GPON MAC drives
  the optics that realtek,pon-optics names.

$ref: /schemas/net/dsa/dsa.yaml#

properties:
  compatible:
    const: realtek,rtl9602c-switch

  reg:
    description:
      The register window of the switch and of the other blocks named above.
    maxItems: 1

  interrupts:
    description:
      The output of the switch's interrupt block, which all of its sources
      share, the GPON MAC's included.
    maxItems: 1

  i2c:
    $ref: /schemas/i2c/i2c-controller.yaml#
    unevaluatedProperties: false
    description:
      The I2C master of the optics, one of the two that the register window
      holds. The devices on its bus, the optics' laser driver, are its
      children.

  realtek,pon-optics:
    description:
      The optics that the GPON MAC drives, a laser driver on the bus of the
      i2c node.
    $ref: /schemas/types.yaml#/definitions/phandle

  realtek,sysctl:
    description:
      The system controller, a syscon. It holds the enable in front of the PON
      MAC and its packet buffer; until that is set, no access to them
      completes.
    $ref: /schemas/types.yaml#/definitions/phandle

  memory-region:
    description:
      The DRAM areas the PON MAC's packet buffer spills into, one per
      direction and each at least 1 MiB. The PON MAC reads and writes them by
      DMA and the CPU never touches them, so they are reserved and no-map.
    items:
      - description: the upstream area
      - description: the downstream area

  memory-region-names:
    items:
      - const: pbo-us
      - const: pbo-ds

required:
  - compatible
  - reg
  - interrupts

dependentRequired:
  memory-region: [ "realtek,sysctl", memory-region-names ]

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    switch@1b000000 {
        compatible = "realtek,rtl9602c-switch";
        reg = <0x1b000000 0xf10000>;
        interrupt-parent = <&intc>;
        interrupts = <8>;
        realtek,sysctl = <&sysctl>;
        realtek,pon-optics = <&laser>;
        memory-region = <&pbo_us>, <&pbo_ds>;
        memory-region-names = "pbo-us", "pbo-ds";

        i2c {
            #address-cells = <1>;
            #size-cells = <0>;

            laser: laser-driver@50 {
                compatible = "semtech,gn25l95";
                reg = <0x50>;
                tx-disable-gpios = <&gpio0 13 GPIO_ACTIVE_HIGH>;
            };
        };

        ethernet-ports {
            #address-cells = <1>;
            #size-cells = <0>;

            port@0 {
                reg = <0>;
                label = "sfp";
                phy-mode = "2500base-x";

                fixed-link {
                    speed = <2500>;
                    full-duplex;
                };
            };

            port@3 {
                reg = <3>;
                ethernet = <&eth>;
                phy-mode = "internal";

                fixed-link {
                    speed = <1000>;
                    full-duplex;
                };
            };
        };
    };
