%YAML 1.2
---
$id: http://devicetree.org/schemas/mips/realtek-rtl9602c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL9602C based boards

maintainers:
  - Paweł Phan <szop.hektar_1w@icloud.com>

description:
  The Realtek RTL9602C is a SoC for GPON optical network units (ONUs). Its CPU
  is one Lexra LX5281, a big-endian MIPS I core, and its GPON MAC sits behind
  the PON port of its Ethernet switch. The ODI DFP-34X-2C3 is a GPON ONU in an
  SFP module, built on this SoC.

properties:
  $nodename:
    const: '/'

  compatible:
    oneOf:
      - description: Boards with the Realtek RTL9602C
        items:
          - enum:
              - odi,dfp-34x-2c3
          - const: realtek,rtl9602c

additionalProperties: true

examples:
  - |
    / {
        compatible = "odi,dfp-34x-2c3", "realtek,rtl9602c";
        model = "ODI DFP-34X-2C3";
        #address-cells = <1>;
        #size-cells = <1>;

        cpus {
            #address-cells = <1>;
            #size-cells = <0>;

            cpu@0 {
                device_type = "cpu";
                compatible = "lexra,lx5281";
                reg = <0>;
            };
        };
    };
