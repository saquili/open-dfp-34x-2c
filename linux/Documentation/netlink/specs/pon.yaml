# SPDX-License-Identifier: ((GPL-2.0 WITH Linux-syscall-note) OR BSD-3-Clause)
---
name: pon
doc: |
  Optical network units (ONUs) of passive optical networks. For each ONU
  the family reports the state of its transmission convergence layer as
  the ONU's MAC gives it (the activation state, the identifiers the OLT
  assigned, the alarms present now and the counters), and its T-CONTs.

  The MAC drivers register the objects. Userspace reads them and is told
  of changes, but can neither create nor change any, because the kernel
  runs the transmission convergence layer. An ONU's traffic travels on its
  gem network interfaces and its OMCI on the character device ponNomci0;
  neither passes through this family. Requests are answered in every
  network namespace; notifications are sent in the initial one only.

definitions:
  -
    type: enum
    name: type
    doc: >-
      The kind of passive optical network, by the ITU-T recommendation that
      its transmission convergence layer follows.
    entries:
      -
        name: gpon
        doc: >-
          G-PON, ITU-T G.984: 2.48832 Gbit/s downstream, 1.24416 or 2.48832
          Gbit/s upstream.
        value: 1
  -
    type: enum
    name: onu-state
    doc: >-
      The activation states of an ONU, O1 to O7, as ITU-T G.984.3
      clause 10.2.1 defines them, and the corresponding states of the other
      transmission convergence layers. An ONU transmits upstream only in
      O3, O4 and O5, and carries traffic only in O5.
    entries:
      -
        name: o1
        doc: >-
          Initial: LOS or LOF is asserted.
        value: 1
      -
        name: o2
        doc: >-
          Standby: the downstream is synchronised, and the ONU waits for
          Upstream_Overhead.
      -
        name: o3
        doc: >-
          Serial number: the ONU answers serial number requests and waits
          for Assign_ONU-ID.
      -
        name: o4
        doc: >-
          Ranging: the ONU has its ONU-ID, answers ranging requests and
          waits for its equalisation delay (Ranging_Time).
      -
        name: o5
        doc: >-
          Operation: the ONU sends data and PLOAM messages as the OLT
          directs.
      -
        name: o6
        doc: >-
          POPUP: entered from O5 on LOS or LOF, with upstream transmission
          stopped. A directed POPUP message returns the ONU to O5, a
          broadcast one to O4, and expiry of timer TO2 to O1.
      -
        name: o7
        doc: >-
          Emergency stop: after Disable_Serial_Number the laser is off and
          the ONU sends nothing upstream.
  -
    type: flags
    name: alarm
    doc: >-
      Alarms of the downstream: conditions present now, not events seen. A
      MAC reports the flags it has.
    entries:
      -
        name: los
        doc: >-
          Loss of signal: no valid downstream signal is received
          (ITU-T G.984.3 clause 11.1.2).
      -
        name: lof
        doc: >-
          Loss of frame: five consecutive invalid PSync fields
          (ITU-T G.984.3 clause 11.1.2).
      -
        name: lom
        doc: >-
          Loss of PLOAM: the frames are synchronised but the PLOAM channel
          is not delineated. It is not an ONU alarm of ITU-T G.984.3, which
          lists loss of PLOAM only among the OLT's alarms, but a condition
          some MACs report; that a MAC's flag means exactly this is an
          assumption, not verified.
      -
        name: pee
        doc: >-
          Physical equipment error: the OLT has said with
          Physical_Equipment_Error that it cannot send GEM frames or OMCC
          frames. Raised by each such message and cleared when none has come
          for 3 s (ITU-T G.984.3 clause 11.1.2).
  -
    type: enum
    name: power-level
    doc: >-
      The transmit power level of an ONU, as it reports it in
      Serial_Number_ONU (ITU-T G.984.3 clause 9.2.4.1). The OLT moves it a
      level at a time with Change_Power_Level; each level is a launch power
      about 3 dB apart from the next.
    entries:
      -
        name: low
        doc: The lowest level.
      -
        name: medium
        doc: The middle level.
      -
        name: high
        doc: The highest level, the one the ONU starts at.

attribute-sets:
  -
    name: dev-stats
    doc: >-
      Counters of the transmission convergence layer: totals since the MAC
      was brought up, not register values, so that every reader sees the
      same numbers even where the MAC's counters clear when read. Every
      counter is sent, zeros included, since a zero is a measurement; a MAC
      that counts none of this leaves the whole nest out. A counter takes 4
      bytes while its value fits in 32 bits and 8 bytes after, so a reader
      must accept both widths. What exactly each one counts is the MAC's
      own definition.
    attributes:
      -
        name: sn-requests
        doc: >-
          Serial number requests: allocations to the activation Alloc-ID,
          254, with the PLOAMu flag.
        type: uint
      -
        name: ranging-requests
        doc: >-
          Ranging requests: allocations to the ONU's default Alloc-ID, its
          ONU-ID, with the PLOAMu flag. In O5 they cannot be told from the
          OLT's other requests for a PLOAM message.
        type: uint
      -
        name: ploam-rx
        doc: >-
          Downstream PLOAM messages received.
        type: uint
      -
        name: ploam-crc-errors
        doc: >-
          Downstream PLOAM messages with a bad CRC, which are discarded.
        type: uint
      -
        name: ploam-overflows
        doc: >-
          Overflows in receiving downstream PLOAM messages. That each is a
          message lost for want of room in the MAC is an assumption, not
          verified.
        type: uint
      -
        name: bwmap-rx
        doc: >-
          Bandwidth maps the ONU's MAC accepted. What a MAC accepts is its own,
          and may be fewer than the map of every 125 us frame; the driver's
          documentation says what its MAC counts.
        type: uint
      -
        name: bwmap-crc-errors
        doc: >-
          Bandwidth map CRC errors, counted per map or per allocation
          structure, since each allocation structure carries its own CRC.
        type: uint
      -
        name: bwmap-overflows
        doc: >-
          Overflows in receiving bandwidth maps. That each is a map lost for
          want of room in the MAC is an assumption, not verified.
        type: uint
      -
        name: gem-frames
        doc: >-
          Downstream GEM frames that carried something; idle frames are not
          counted.
        type: uint
      -
        name: bip-errors
        doc: >-
          Errors of the downstream bit-interleaved parity (BIP,
          ITU-T G.984.3 clause 8.1.3.4), counted as the bits that differed,
          which is G.984.3's ERR (clause 11.2.2).
        type: uint
      -
        name: fec-corrected-bytes
        doc: >-
          Downstream bytes that forward error correction (FEC) corrected
          (ITU-T G.984.3 clause 13.1.3).
        type: uint
      -
        name: fec-corrected-codewords
        doc: >-
          Downstream codewords that FEC corrected.
        type: uint
      -
        name: fec-uncorrectable-codewords
        doc: >-
          Downstream codewords with more errors than FEC corrects.
        type: uint
      -
        name: fec-codewords
        doc: >-
          Downstream codewords received while the downstream carried FEC,
          all of them decoded. 0 while it carries none.
        type: uint
      -
        name: password-requests
        doc: >-
          Request_Password messages (ITU-T G.984.3 clause 9.2.3.9) the ONU
          acted on: those directed to it while it was in O5. 0 when the OLT
          never asked, as an OLT that does not check passwords does not.
        type: uint
      -
        name: password-replies
        doc: >-
          Of those, the requests the ONU answered with the Password message
          (clause 9.2.4.2). Fewer than password-requests means that the ONU
          had no password to give when the OLT asked; what the OLT then does
          is its own.
        type: uint
  -
    name: dev
    doc: >-
      An ONU, as its MAC reports it. What the MAC does not know is left out
      rather than sent as 0, because 0 is a valid ONU-ID, Port-ID and
      Alloc-ID, and "no alarms" is a claim a MAC in reset cannot make.
    attributes:
      -
        name: id
        doc: >-
          The ONU's number, the N of its PON device ponN: the lowest number
          free when the MAC first registered.
        type: u32
      -
        name: ifindex
        doc: >-
          The network interface that carries the ONU's traffic, on which its
          gem interfaces are created. Absent when unknown.
        type: u32
      -
        name: type
        doc: >-
          The kind of PON. Absent when unknown.
        type: u32
        enum: type
      -
        name: onu-state
        doc: >-
          The activation state. Absent when unknown, as while the MAC is
          down.
        type: u32
        enum: onu-state
      -
        name: onu-id
        doc: >-
          The ONU-ID the OLT assigned with Assign_ONU-ID in O3, from 0 to 253
          (255 addresses every ONU), until Deactivate_ONU-ID discards it.
          Absent while the ONU has none.
        type: u32
      -
        name: alloc-id
        doc: >-
          An Alloc-ID the OLT assigned to the ONU, one attribute each. A
          report carries at most 32, the first 32 of a MAC that holds more;
          that no OLT assigns this many to one ONU is an assumption, not
          verified. Alloc-IDs have 12 bits: the default Alloc-ID equals the
          ONU-ID and carries PLOAM and OMCI, and a MAC may leave it out;
          further ones, from 256 to 4095, come with Assign_Alloc-ID; 254 is
          the activation Alloc-ID and 255 means unassigned.
        type: u32
        multi-attr: true
      -
        name: omcc-port-id
        doc: >-
          The Port-ID of the OMCI channel, once the OLT has configured it
          with Configure_Port-ID. Its messages reach the OMCI control port
          ponNomci0; it is never a gem interface. Absent until configured.
        type: u32
      -
        name: alarms
        doc: >-
          The alarms present now. Absent when the MAC cannot report them, so
          a clear flag means no alarm only when the attribute is there.
        type: u32
        enum: alarm
        enum-as-flags: true
      -
        name: stats
        doc: >-
          The counters of the transmission convergence layer. Absent when the
          MAC keeps none.
        type: nest
        nested-attributes: dev-stats
      -
        name: serial-number
        doc: >-
          The ONU's serial number as the ONU sends it in Serial_Number_ONU
          (ITU-T G.984.3 clause 9.2.4.1): four ASCII characters of Vendor_ID,
          then four bytes of vendor-specific serial number. Absent while the
          MAC has none.
        type: binary
        checks:
          exact-len: 8
      -
        name: num-gem-ports
        doc: >-
          The size of the MAC's flow space, as its data path registered it.
          The ONU has no more gem interfaces than this; a MAC that keeps
          flows for itself, as one that carries OMCI in a flow of its own
          does, offers fewer. 0 while no data path is registered.
        type: u32
      -
        name: num-tconts
        doc: >-
          The T-CONTs the ONU can be given for subscriber traffic, as its
          data path registered them; their indices run from 0 to this less
          one. A T-CONT the MAC keeps for its own management channel is not
          counted: no T-CONT managed entity (ITU-T G.988 clause 9.2.2) need
          point at it, since the default Alloc-ID, which carries OMCI, can
          stay outside all of them. 0 until a data path is registered; the
          value stays when the data path unregisters.
        type: u32
      -
        name: num-tcont-queues
        doc: >-
          The upstream queues of each of those T-CONTs, as the data path
          registered them; the queue that IFLA_GEM_QUEUE names is below it,
          0 the highest priority. ITU-T G.988 models each as a priority
          queue managed entity (clause 9.2.10). 0 until a data path is
          registered; the value stays when the data path unregisters.
        type: u32
      -
        name: power-level
        doc: >-
          The transmit power level, while the MAC transmits at one of the
          levels the OLT can change.
        type: u32
        enum: power-level
      -
        name: eqd
        doc: >-
          The equalization delay the OLT assigned with Ranging_Time (ITU-T
          G.984.3 clause 9.2.3.4), in upstream bit periods: the time the ONU
          waits, beyond its response time, before it transmits, so that every
          ONU's bursts reach the OLT as though from one distance. An ONU
          further from the OLT gets less. Absent outside O5.
        type: u32
      -
        name: onu-state-time
        doc: >-
          How long the ONU has been in its activation state onu-state, in
          milliseconds. Absent with onu-state, and when the MAC does not
          know. Its passing is no change of the ONU's status: a MAC sends
          dev-change-ntf for a change of the other attributes, not for this.
        type: uint
      -
        name: encrypted-port-id
        doc: >-
          A Port-ID whose downstream the OLT encrypts, one attribute each, in
          ascending order. The OLT marks a Port-ID encrypted, or no longer,
          with Encrypted_Port-ID (ITU-T G.984.3 clause 9.2.3.8); G-PON
          encrypts only the downstream GEM payload, with 128-bit AES
          (clause 12.2). The OMCC's Port-ID is among them when the OLT
          encrypts the OMCC, and so is a Port-ID that no gem interface
          carries yet. A MAC that reports onu-state reports these too, so
          that there a Port-ID not listed is carried in the clear. The marks
          go with the ONU-ID: an ONU without one has none. A report carries
          at most 128, the lowest of a MAC that holds more; that an OLT
          encrypts no more Port-IDs for one ONU than that is an assumption,
          not verified. A change is announced with dev-change-ntf.
        type: u32
        multi-attr: true
  -
    name: tcont
    doc: >-
      A transmission container (T-CONT), the unit the OLT grants upstream
      bandwidth to: each allocation of the bandwidth map is for one T-CONT,
      named by its Alloc-ID (ITU-T G.984.3 clause 8.1.3.6). ITU-T G.988
      models it as the T-CONT managed entity (clause 9.2.2).
    attributes:
      -
        name: id
        doc: >-
          The ONU, by the id of its dev object.
        type: u32
      -
        name: index
        doc: >-
          The T-CONT's index, from 0 and below the ONU's num-tconts: the
          number that IFLA_GEM_TCONT gives when a gem interface is created.
        type: u32
      -
        name: alloc-id
        doc: >-
          The Alloc-ID bound to the T-CONT. Absent while the T-CONT is idle,
          since 0 is a valid Alloc-ID: the default Alloc-ID of ONU-ID 0. In
          tcont-set, the Alloc-ID the T-CONT is mapped to, absent to unmap
          it.
        type: u32
        checks:
          max: 4095
  -
    name: tod
    doc: >-
      The time of day that the OLT gives an ONU through the OMCC, with the
      Time of day information attribute of the OLT-G managed entity (ITU-T
      G.988 clause 9.12.2): a downstream frame N and TstampN, the time at
      which the first bit of frame N reaches a hypothetical ONU with an
      equalization delay and a response time of zero (ITU-T G.984.3
      Amendment 2 clause 10.4.6.1).
    attributes:
      -
        name: id
        doc: >-
          The ONU, by the id of its dev object.
        type: u32
      -
        name: superframe
        doc: >-
          N: the superframe counter of the downstream frame, the attribute's
          first four bytes.
        type: u32
        checks:
          max: 1073741823
      -
        name: sec
        doc: >-
          The seconds of TstampN, an IEEE 1588 timestamp: the attribute's
          next six bytes.
        type: u64
        checks:
          max: 281474976710655
      -
        name: nsec
        doc: >-
          The nanoseconds of TstampN: the attribute's last four bytes.
        type: u32
        checks:
          max: 999999999
operations:
  list:
    -
      name: dev-get
      doc: >-
        Get one ONU by id, or dump every ONU. A report starts from nothing
        known and takes what the MAC reports; an ONU whose MAC gives no
        status, or fails to, is reported with id, num-gem-ports, num-tconts
        and num-tcont-queues only. A get without id fails with EINVAL, and one for an
        unknown id with ENODEV. Any user may get an ONU: its serial number is
        no secret, as the ONU sends it in the clear when it registers and it
        is printed on the unit, and its PLOAM password, which is, is never
        reported.
      attribute-set: dev

      do:
        request:
          attributes:
            - id
        reply: &dev-attrs
          attributes:
            - id
            - ifindex
            - type
            - onu-state
            - onu-id
            - alloc-id
            - omcc-port-id
            - alarms
            - stats
            - serial-number
            - num-gem-ports
            - num-tconts
            - num-tcont-queues
            - power-level
            - eqd
            - onu-state-time
            - encrypted-port-id

      dump:
        reply: *dev-attrs

    -
      name: dev-change-ntf
      doc: >-
        A change of an ONU's status as its MAC reports it, with the
        attributes of a dev-get reply, sent to the monitor group in the
        initial network namespace. Joining the group needs CAP_NET_ADMIN.
      notify: dev-get
      mcgrp: monitor

    -
      name: tcont-get
      doc: >-
        Get one T-CONT of an ONU by id and index, or dump every T-CONT of
        every ONU; alloc-id is absent while the T-CONT is idle. A get fails
        with EINVAL without id or index, with ENODEV for an unknown ONU, and
        with ENOENT when the MAC does not report T-CONTs or has no T-CONT of
        that index; a dump skips the ONUs whose MAC does not report T-CONTs.
        Both expect the ONU's MAC to have registered its data path, which a
        num-gem-ports other than 0 shows; the kernel does not check for it.
        Any user may get a T-CONT.
      attribute-set: tcont

      do:
        request:
          attributes:
            - id
            - index
        reply: &tcont-attrs
          attributes:
            - id
            - index
            - alloc-id

      dump:
        reply: *tcont-attrs

    -
      name: tcont-set
      doc: >-
        Map one T-CONT of an ONU, by id and index, to the Alloc-ID given, or
        unmap it when alloc-id is absent, as the OLT does through the OMCC
        with the Alloc-ID attribute of the T-CONT managed entity (ITU-T
        G.984.3 clause 5.5.4, ITU-T G.988 clause 9.2.2). The MAC binds the
        T-CONT to the Alloc-ID once the OLT has also assigned that Alloc-ID
        to the ONU with Assign_Alloc-ID, and it may bind an assigned
        Alloc-ID that no mapping names to a T-CONT that no mapping names,
        so that upstream traffic flows before or without the mappings. Fails
        with EINVAL without id or index, with ENODEV for an unknown ONU, with
        EOPNOTSUPP when the MAC does not map T-CONTs, with ENOENT when it has
        no T-CONT of that index, and with EBUSY when another T-CONT is
        mapped to the Alloc-ID, since an Alloc-ID serves at most one user
        traffic T-CONT.
      attribute-set: tcont
      flags: [admin-perm]

      do:
        request:
          attributes:
            - id
            - index
            - alloc-id
    -
      name: tod-set
      doc: >-
        Set the ONU's PTP hardware clock, when downstream frame N arrives, to
        the time at which that frame reaches the ONU: TstampN less (EqD +
        response time) x n1490 / (n1310 + n1490), as ITU-T G.984.3
        Amendment 2 clause 10.4.6.2 has the ONU compute it. The MAC sets the
        clock once, follows a change of the equalization delay until frame N,
        and drops a pending setting for a new one. Fails with EINVAL without
        id, superframe, sec or nsec, with ENODEV for an unknown ONU, with
        EOPNOTSUPP when the MAC cannot set a clock at a frame, with EAGAIN
        while the ONU has no equalization delay, and with ERANGE when frame N
        has passed or lies half the counter's span or more ahead.
      attribute-set: tod
      flags: [admin-perm]

      do:
        request:
          attributes:
            - id
            - superframe
            - sec
            - nsec

mcast-groups:
  list:
    -
      name: monitor
      flags: [ admin-perm ]
